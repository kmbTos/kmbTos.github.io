<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>モンティホール問題 体感ゲーム</title>
<style>
  :root{
    --bg:#0e1020; --panel:#1a1e38; --accent:#ffcf4a; --accent2:#4ac9ff;
    --good:#3ddc84; --bad:#ff5470; --text:#eef1ff; --muted:#9aa0c7;
    --door:#8b5a2b; --door2:#6d4522;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;
    background:radial-gradient(circle at 50% 0%,#232750,#0e1020 70%);
    color:var(--text); min-height:100vh; padding:20px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{font-size:1.6rem; margin:.2em 0; text-align:center;
     background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text; background-clip:text; color:transparent;}
  .modebar{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:8px 0 4px;}
  .modebar button{background:#2b3162; color:var(--muted); padding:8px 16px; font-size:.9rem;}
  .modebar button.active{background:var(--accent); color:#20160a;}
  .msg{min-height:1.6em; font-size:1.15rem; text-align:center; margin:6px 0 14px; font-weight:600; max-width:700px;}
  .msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
  .doors{display:flex; gap:24px; justify-content:center; flex-wrap:wrap; margin:10px 0 20px;}
  .doors.many{gap:8px; max-width:900px;}
  .door{
    width:130px; height:190px; border-radius:10px 10px 4px 4px;
    background:linear-gradient(160deg,var(--door),var(--door2));
    border:4px solid #3a2413; position:relative; cursor:pointer;
    transition:transform .2s, box-shadow .2s, opacity .3s;
    box-shadow:0 8px 18px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  .doors.many .door{width:54px; height:74px; border-width:2px; border-radius:5px;}
  .doors.many .door .num{font-size:.7rem; top:3px;}
  .doors.many .door .knob{width:6px; height:6px; right:6px;}
  .doors.many .door .content{font-size:1.5rem;}
  .door:hover:not(.disabled){transform:translateY(-6px); box-shadow:0 14px 24px rgba(0,0,0,.6);}
  .door .num{position:absolute; top:10px; left:0; right:0; text-align:center;
    font-size:1.3rem; font-weight:800; color:#ffe9b0; text-shadow:0 1px 2px #000;}
  .door .knob{position:absolute; right:14px; top:50%; width:12px; height:12px; border-radius:50%;
    background:#ffd54a; box-shadow:0 0 6px #ffd54a;}
  .door .content{font-size:3.4rem; opacity:0; transition:opacity .3s;}
  .door.open .content{opacity:1}
  .door.open{background:linear-gradient(160deg,#20243f,#12152a); border-color:#2a2f52;}
  .door.selected{outline:4px solid var(--accent); outline-offset:3px; z-index:1;}
  .doors.many .door.selected{outline-width:3px;}
  .door.disabled{cursor:default}
  .door.dim{opacity:.4}
  .controls{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:18px;}
  button{
    font:inherit; font-weight:700; padding:11px 20px; border-radius:9px; border:none;
    cursor:pointer; background:var(--accent); color:#20160a; transition:filter .15s, transform .1s;
  }
  button.sec{background:var(--accent2); color:#062130;}
  button:hover:not(:disabled){filter:brightness(1.1)} button:active:not(:disabled){transform:scale(.96)}
  button:disabled{opacity:.4; cursor:default;}
  .stats{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; width:100%; max-width:640px;}
  .card{background:var(--panel); border-radius:12px; padding:14px 18px; flex:1; min-width:150px; border:1px solid #2b3162;}
  .card h3{margin:0 0 8px; font-size:.85rem; color:var(--muted); letter-spacing:.05em;}
  .row{display:flex; justify-content:space-between; font-size:.95rem; margin:3px 0;}
  .rate{font-size:1.5rem; font-weight:800;}
  .rate.stay{color:var(--bad)} .rate.switch{color:var(--good)}
  .bar{height:8px; border-radius:5px; background:#2b3162; margin-top:4px; overflow:hidden;}
  .bar>div{height:100%; transition:width .4s;}
  .note{color:var(--muted); font-size:.82rem; text-align:center; max-width:560px; margin:16px auto 0; line-height:1.5;}
  .auto{display:flex; align-items:center; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  .auto input{width:70px; padding:6px; border-radius:6px; border:1px solid #2b3162; background:#12152a; color:var(--text);}
</style>
</head>
<body>
  <h1>🐐 モンティホール問題 🚗</h1>

  <div class="modebar" id="modebar">
    <button data-n="3" class="active">3扉モード</button>
    <button data-n="100">100扉モード</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="doors" id="doors"></div>

  <div class="controls">
    <button id="stayBtn" class="sec" disabled>そのまま (Stay)</button>
    <button id="switchBtn" disabled>変更する (Switch)</button>
    <button id="nextBtn" style="display:none">次のゲーム ▶</button>
  </div>

  <div class="stats">
    <div class="card">
      <h3>STAY（変えない）</h3>
      <div class="row"><span>勝ち / 試行</span><span id="stayWL">0 / 0</span></div>
      <div class="rate stay" id="stayRate">–</div>
      <div class="bar"><div id="stayBar" style="width:0%;background:var(--bad)"></div></div>
    </div>
    <div class="card">
      <h3>SWITCH（変える）</h3>
      <div class="row"><span>勝ち / 試行</span><span id="switchWL">0 / 0</span></div>
      <div class="rate switch" id="switchRate">–</div>
      <div class="bar"><div id="switchBar" style="width:0%;background:var(--good)"></div></div>
    </div>
  </div>

  <div class="auto">
    <span>自動シミュレーション:</span>
    <input id="autoN" type="number" value="1000" min="1" max="100000">回
    <button id="autoStay" class="sec">全部Stay</button>
    <button id="autoSwitch">全部Switch</button>
  </div>

  <p class="note" id="note"></p>

<script>
const G = { N:3, carDoor:0, chosen:-1, opened:[], phase:'choose',
  stats:{ stay:{w:0,n:0}, switch:{w:0,n:0} } };
window.G = G;

const doorsEl = document.getElementById('doors');
const msgEl = document.getElementById('msg');
const noteEl = document.getElementById('note');
const stayBtn = document.getElementById('stayBtn');
const switchBtn = document.getElementById('switchBtn');
const nextBtn = document.getElementById('nextBtn');

function setMsg(t,cls){ msgEl.textContent=t; msgEl.className='msg'+(cls?' '+cls:''); }

function buildDoors(){
  doorsEl.innerHTML='';
  doorsEl.classList.toggle('many', G.N>3);
  for(let i=0;i<G.N;i++){
    const d=document.createElement('div');
    d.className='door'; d.dataset.i=i;
    d.innerHTML=`<span class="num">${i+1}</span><span class="knob"></span><span class="content"></span>`;
    d.addEventListener('click',()=>chooseDoor(i));
    doorsEl.appendChild(d);
  }
}
function doorEl(i){ return doorsEl.children[i]; }

function newGame(){
  G.carDoor=Math.floor(Math.random()*G.N);
  G.chosen=-1; G.opened=[]; G.phase='choose';
  buildDoors();
  setMsg(G.N>3
    ? `${G.N}個のドアから1つ選んでください。当たりの車は1つだけ！`
    : '3つのドアから1つ選んでください。1つだけ車、残りはヤギ。');
  noteEl.innerHTML = G.N>3
    ? `最初に当てられる確率はわずか <b>1/${G.N}</b>。司会者があなたの選択と当たり以外を全部開けて、残り2つに絞ります。ここで<b>変更すると勝率 ${G.N-1}/${G.N}</b>！ 直感とのズレが劇的にわかります。`
    : '最初の選択が正解の確率は 1/3。司会者がヤギのドアを1つ開けた後、<b>変更すると勝率2/3</b>、変えないと1/3 のままです。回数を重ねて理論値に近づくのを確かめましょう。';
  stayBtn.disabled=true; switchBtn.disabled=true;
  nextBtn.style.display='none';
  stayBtn.style.display=''; switchBtn.style.display='';
}

function chooseDoor(i){
  if(G.phase!=='choose') return;
  G.chosen=i;
  // 司会者は「選択」と「当たり」以外を全部開ける → 残り2つに絞る
  const candidates=[];
  for(let k=0;k<G.N;k++) if(k!==G.chosen && k!==G.carDoor) candidates.push(k);
  // 選択が当たりの場合、開けずに残す1つをランダムに除外
  if(G.chosen===G.carDoor){
    const keep=candidates.splice(Math.floor(Math.random()*candidates.length),1);
  }
  G.opened=candidates;
  G.phase='decide';

  const otherDoor=[...Array(G.N).keys()].find(x=>x!==G.chosen && !G.opened.includes(x));

  for(let k=0;k<G.N;k++){
    const d=doorEl(k);
    d.classList.add('disabled');
    if(k===i) d.classList.add('selected');
    if(G.opened.includes(k)){
      d.classList.add('open','dim');
      d.querySelector('.content').textContent='🐐';
    }
  }
  setMsg(G.N>3
    ? `ドア${i+1}を選択。司会者が${G.opened.length}個のヤギを開け、残ったのは【あなたのドア${i+1}】と【ドア${otherDoor+1}】。そのまま？変更する？`
    : `ドア${i+1}を選びました。司会者がドア${G.opened[0]+1}を開けてヤギ！ そのまま？変更する？`);
  stayBtn.disabled=false; switchBtn.disabled=false;
}

function decide(doSwitch){
  if(G.phase!=='decide') return;
  let finalDoor=G.chosen;
  if(doSwitch){
    finalDoor=[...Array(G.N).keys()].find(x=>x!==G.chosen && !G.opened.includes(x));
  }
  G.phase='done';
  const win = finalDoor===G.carDoor;
  const bucket = doSwitch?G.stats.switch:G.stats.stay;
  bucket.n++; if(win) bucket.w++;

  for(let k=0;k<G.N;k++){
    const d=doorEl(k);
    d.classList.remove('selected','dim');
    d.classList.add('open');
    d.querySelector('.content').textContent = (k===G.carDoor)?'🚗':'🐐';
  }
  doorEl(finalDoor).classList.add('selected');

  setMsg(win ? `🎉 ${doSwitch?'変更して':'そのままで'}正解！車をゲット！`
             : `😢 残念…ヤギでした。（${doSwitch?'変更':'Stay'}）`,
         win?'good':'bad');
  stayBtn.disabled=true; switchBtn.disabled=true;
  stayBtn.style.display='none'; switchBtn.style.display='none';
  nextBtn.style.display='';
  render();
}

function render(){
  const s=G.stats.stay, w=G.stats.switch;
  document.getElementById('stayWL').textContent=`${s.w} / ${s.n}`;
  document.getElementById('switchWL').textContent=`${w.w} / ${w.n}`;
  const sr=s.n?Math.round(s.w/s.n*100):null;
  const wr=w.n?Math.round(w.w/w.n*100):null;
  document.getElementById('stayRate').textContent = sr===null?'–':sr+'%';
  document.getElementById('switchRate').textContent = wr===null?'–':wr+'%';
  document.getElementById('stayBar').style.width=(sr||0)+'%';
  document.getElementById('switchBar').style.width=(wr||0)+'%';
}

// 自動シミュレーション（N扉一般化）
function simulate(doSwitch,n){
  const bucket = doSwitch?G.stats.switch:G.stats.stay;
  for(let t=0;t<n;t++){
    const car=Math.floor(Math.random()*G.N);
    const chosen=Math.floor(Math.random()*G.N);
    // Switch時の最終ドア = 残り2つのうち選択でない方
    // Stayなら最初の選択のまま
    let win;
    if(!doSwitch){ win=(chosen===car); }
    else{
      // 残るもう1つ: chosen===car ならランダムなヤギ(=負け)、そうでなければ当たりが残る(=勝ち)
      win=(chosen!==car);
    }
    bucket.n++; if(win) bucket.w++;
  }
  render();
}

function setMode(n){
  G.N=n;
  document.querySelectorAll('#modebar button').forEach(b=>
    b.classList.toggle('active', +b.dataset.n===n));
  newGame();
}

stayBtn.onclick=()=>decide(false);
switchBtn.onclick=()=>decide(true);
nextBtn.onclick=newGame;
document.getElementById('autoStay').onclick=()=>simulate(false,clampN());
document.getElementById('autoSwitch').onclick=()=>simulate(true,clampN());
document.querySelectorAll('#modebar button').forEach(b=>
  b.onclick=()=>setMode(+b.dataset.n));
function clampN(){ let n=parseInt(document.getElementById('autoN').value)||0;
  return Math.max(1,Math.min(100000,n)); }

setMode(3);
render();
</script>
</body>
</html>
