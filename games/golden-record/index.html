<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゴールデンレコード ― 星へのラブレター</title>
<meta name="description" content="ボイジャー探査機のゴールデンレコードを解読するWeb謎解き。">
<style>
:root{
  --bg:#070a10; --bg2:#0d1219; --panel:#121821; --panel2:#171f2a;
  --line:#2a3646; --line2:#3d4c60;
  --gold:#e3c168; --gold2:#f5e4ac; --gold-dim:#8d7639;
  --ink:#d7e0ea; --ink-dim:#8b98a8;
  --cyan:#6fd6e0; --green:#8fe0a0; --red:#e08b7a;
  --shadow:0 8px 30px rgba(0,0,0,.55);
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.7; overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:12px;padding:8px 14px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,24,33,.96),rgba(7,10,16,.86));
  backdrop-filter:blur(6px); position:sticky;top:0;z-index:40;
}
header h1{
  font-size:15px;margin:0;letter-spacing:.14em;color:var(--gold2);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
header h1 small{display:block;font-size:10px;letter-spacing:.3em;color:var(--gold-dim);font-weight:400}
.spacer{flex:1}
.hbtn{
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit;
  white-space:nowrap;
}
.hbtn:hover{border-color:var(--gold-dim);color:var(--gold2)}
#progress{font-family:var(--mono);font-size:11px;color:var(--ink-dim);white-space:nowrap}
#progress b{color:var(--gold)}

/* ---------- layout ---------- */
#main{flex:1;display:grid;grid-template-columns:210px minmax(0,1fr) 250px;gap:12px;padding:12px;align-items:start}
@media(max-width:1000px){
  #main{grid-template-columns:1fr;gap:10px;padding:10px}
  .col-center{order:1} .col-right{order:2} .col-left{order:3}
}
@media(max-width:560px){
  header{gap:7px;padding:7px 9px}
  header h1{font-size:13px;letter-spacing:.06em}
  header h1 small{display:none}
  #progress{font-size:10px}
  .hbtn{padding:5px 8px;font-size:11px}
}
.col{display:flex;flex-direction:column;gap:10px}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
}
.card>h2{
  margin:0;padding:8px 12px;font-size:11.5px;letter-spacing:.18em;color:var(--gold-dim);
  border-bottom:1px solid var(--line);font-weight:600;
}
.card>.body{padding:10px 12px}

/* ---------- shelf / device buttons ---------- */
.thing{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:7px 8px;color:var(--ink);font-family:inherit;font-size:13px;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.thing:hover{background:rgba(227,193,104,.07);border-color:var(--gold-dim)}
.thing[disabled]{opacity:.34;cursor:not-allowed}
.thing .ic{width:26px;height:26px;flex:none;display:grid;place-items:center}
.thing .tx{flex:1;min-width:0}
.thing .tx b{display:block;font-weight:600;font-size:13px;line-height:1.35}
.thing .tx i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-dim);line-height:1.35}
.thing.new::after{content:"NEW";font-size:9px;color:#0a0d12;background:var(--gold);border-radius:3px;padding:1px 4px;letter-spacing:.06em}

/* ---------- disc stage ---------- */
#stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px 14px}
#discWrap{position:relative;width:min(76vw,520px);aspect-ratio:1;perspective:1200px}
#disc{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.5,.05,.3,1)}
#disc.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:50%}
.face.back{transform:rotateY(180deg)}
.face svg{width:100%;height:100%;display:block;border-radius:50%}
.hot{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2;transition:fill .18s,stroke .18s}
.hot:hover{fill:rgba(227,193,104,.13);stroke:rgba(227,193,104,.85)}
.hot.seen:hover{stroke:rgba(143,224,160,.8)}
.hotr{cursor:pointer;fill:none;stroke:transparent;transition:stroke .18s}
.hotr:hover{stroke:rgba(227,193,104,.16)}
#disc.showhot .hot{stroke:rgba(52,34,4,.72);stroke-width:3;stroke-dasharray:8 6}
#disc.showhot .hotr{stroke:rgba(52,34,4,.13)}
#disc.showhot .hot.seen{stroke:rgba(24,92,44,.6);stroke-dasharray:3 7}
#discCtl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink-dim);
  border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:inherit;
}
.pill.on{color:#0a0d12;background:var(--gold);border-color:var(--gold);font-weight:600}
#caption{font-size:12px;color:var(--ink-dim);text-align:center;min-height:1.7em;max-width:520px}

/* ---------- notebook ---------- */
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{
  flex:1;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--ink-dim);font-family:inherit;font-size:12px;padding:8px 2px;cursor:pointer;
}
#tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.tabpane{display:none;padding:8px 10px;max-height:46vh;overflow:auto}
.tabpane.on{display:block}
@media(max-width:1000px){.tabpane{max-height:none}}
.note{
  border-left:2px solid var(--gold-dim);background:rgba(255,255,255,.025);
  padding:6px 9px;margin:0 0 7px;border-radius:0 6px 6px 0;font-size:12.5px;
}
.note b{color:var(--gold2);display:block;font-size:11.5px;letter-spacing:.05em}
.note .v{font-family:var(--mono);color:var(--cyan);word-break:break-all}
.quest{border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin:0 0 8px;background:rgba(0,0,0,.2)}
.quest .q{font-size:12.5px;margin-bottom:6px}
.quest.done{border-color:rgba(143,224,160,.45);background:rgba(143,224,160,.06)}
.quest.done .q::before{content:"✓ ";color:var(--green)}
.ansrow{display:flex;gap:5px}
.ansrow input{
  flex:1;min-width:0;background:#0a0e14;border:1px solid var(--line2);border-radius:6px;
  color:var(--ink);padding:6px 8px;font-family:inherit;font-size:13px;
}
.ansrow input:focus{outline:none;border-color:var(--gold)}
.ansrow button{
  background:var(--gold-dim);border:0;border-radius:6px;color:#0a0d12;font-weight:700;
  padding:0 11px;cursor:pointer;font-family:inherit;font-size:12px;
}
.ansrow button:hover{background:var(--gold)}
.hintbox{font-size:12px;color:var(--ink-dim);margin-top:6px}
.hintbox button{background:none;border:1px dashed var(--line2);color:var(--ink-dim);
  border-radius:5px;font-size:11px;padding:2px 7px;cursor:pointer;font-family:inherit;margin-right:4px}
.hintbox button:hover{color:var(--gold2);border-color:var(--gold-dim)}
.hinttext{border-left:2px solid var(--line2);padding-left:8px;margin-top:5px;font-size:12px;color:var(--ink)}

/* ---------- modal ---------- */
#veil{
  position:fixed;inset:0;background:rgba(3,5,9,.82);z-index:100;display:none;
  align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px);
}
#veil.on{display:flex}
#modal{
  background:linear-gradient(180deg,#141b25,#0f151d);border:1px solid var(--line2);
  border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.7);
  width:min(760px,100%);max-height:92vh;overflow:auto;position:relative;
}
#modal h3{
  margin:0;padding:11px 44px 11px 15px;font-size:13px;letter-spacing:.14em;color:var(--gold2);
  border-bottom:1px solid var(--line);position:sticky;top:0;
  background:linear-gradient(180deg,#161e29,#141b25);z-index:2;
}
#modal .mbody{padding:14px 15px 18px}
#close{
  position:absolute;top:7px;right:9px;width:28px;height:28px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink);cursor:pointer;
  font-size:15px;line-height:1;z-index:3;
}
#close:hover{color:var(--gold2);border-color:var(--gold-dim)}
.mbody p{margin:0 0 10px}
.mbody .lead{color:var(--gold2)}
.mbody .fig{display:block;margin:10px auto;max-width:100%}
.dim{color:var(--ink-dim);font-size:12.5px}
.mono{font-family:var(--mono)}
kbd{font-family:var(--mono);background:#0a0e14;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;font-size:12px;color:var(--cyan)}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{
  background:rgba(18,24,33,.97);border:1px solid var(--gold-dim);border-radius:8px;
  padding:8px 14px;font-size:12.5px;color:var(--gold2);box-shadow:var(--shadow);
  animation:tin .3s ease-out; text-align:center;
}
.toast.ok{border-color:rgba(143,224,160,.6);color:var(--green)}
.toast.ng{border-color:rgba(224,139,122,.6);color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- devices (generic) ---------- */
.ctlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.ctlrow label{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
.ctlrow input[type=range]{width:150px;accent-color:var(--gold)}
.ctlrow input[type=number],.ctlrow input[type=text],.ctlrow select{
  background:#0a0e14;border:1px solid var(--line2);border-radius:5px;color:var(--cyan);
  padding:4px 7px;font-family:var(--mono);font-size:13px;width:88px;
}
.btn{
  background:var(--panel2);border:1px solid var(--line2);border-radius:6px;color:var(--ink);
  padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
}
.btn:hover{border-color:var(--gold-dim);color:var(--gold2)}
.btn.primary{background:var(--gold-dim);color:#0a0d12;border-color:var(--gold-dim);font-weight:700}
.btn.primary:hover{background:var(--gold)}
canvas.screen{display:block;width:100%;background:#05070b;border:1px solid var(--line2);border-radius:8px;image-rendering:pixelated}
.readout{font-family:var(--mono);font-size:12px;color:var(--cyan);background:#05070b;
  border:1px solid var(--line);border-radius:6px;padding:6px 9px;white-space:pre-wrap;word-break:break-all}


.quest.big{border-color:var(--gold-dim);background:rgba(227,193,104,.07)}
.marks{background:#c9a24a;color:#43300c;border-radius:8px;padding:10px 12px;margin:10px 0}
.marks .cap{font-size:11px;letter-spacing:.08em;margin-bottom:6px;opacity:.75}
.markrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}
.mk{display:inline-block;background:#43300c;flex:none}
.mk.one{width:3px;height:20px}
.mk.zero{width:11px;height:3px;margin:9px 0}
.grp{font-family:var(--mono);font-size:16px;color:#eef4fb;background:#39434f;border-radius:4px;padding:2px 6px;letter-spacing:-2px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.tbl th{color:var(--gold-dim);font-weight:600}
hr{border:0;border-top:1px solid var(--line)}

/* ---------- title screen ---------- */
#title{position:fixed;inset:0;z-index:300;background:radial-gradient(ellipse at 50% 40%,#101823,#03050a 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px;text-align:center}
#title.hide{display:none}
#title .tt{font-size:clamp(21px,5.4vw,38px);letter-spacing:.2em;color:var(--gold2);margin:0;font-weight:600}
#title .ts{font-size:11px;letter-spacing:.42em;color:var(--gold-dim);margin:0}
#title p.lead2{max-width:620px;font-size:13.5px;color:var(--ink);margin:0}
#title .credit{font-size:11px;color:var(--ink-dim)}
#tdisc{width:min(46vw,180px);aspect-ratio:1;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div id="app">
  <header>
    <h1>ゴールデンレコード<small>VOYAGER · THE GOLDEN RECORD</small></h1>
    <div class="spacer"></div>
    <div id="progress"></div>
    <button class="hbtn" id="btnAfter" style="display:none">あとがき</button>
    <button class="hbtn" id="btnHelp">遊び方</button>
    <button class="hbtn" id="btnReset">最初から</button>
  </header>

  <div id="main">
    <!-- 左: 本棚 -->
    <div class="col col-left">
      <div class="card">
        <h2>資 料 棚</h2>
        <div class="body" id="shelf"></div>
      </div>
      <div class="card" id="storyCard">
        <h2>状 況</h2>
        <div class="body" id="story" style="font-size:12.5px"></div>
      </div>
    </div>

    <!-- 中央: ディスク -->
    <div class="col col-center">
      <div class="card">
        <h2 id="discTitle">円 盤</h2>
        <div id="stage">
          <div id="discCtl">
            <button class="pill on" data-face="front">表（ジャケット）</button>
            <button class="pill" data-face="back">裏（記録面）</button>
            <button class="pill" id="btnShowHot">◎ 調べられる場所</button>
            <button class="pill" id="btnSwapDisc" style="display:none">◆ 異星の円盤へ</button>
          </div>
          <div id="discWrap">
            <div id="disc">
              <div class="face front" id="faceFront"></div>
              <div class="face back" id="faceBack"></div>
            </div>
          </div>
          <div id="caption">気になるところをクリック（タップ）して観察しよう。</div>
        </div>
      </div>
    </div>

    <!-- 右: 装置 + ノート -->
    <div class="col col-right">
      <div class="card">
        <h2>装 置</h2>
        <div class="body" id="devices"></div>
      </div>
      <div class="card">
        <h2>調 査 ノ ー ト</h2>
        <div id="tabs">
          <button class="on" data-tab="quests">謎</button>
          <button data-tab="notes">記録</button>
        </div>
        <div class="tabpane on" id="pane-quests"></div>
        <div class="tabpane" id="pane-notes"></div>
      </div>
    </div>
  </div>
</div>

<div id="veil"><div id="modal"><button id="close">✕</button><h3></h3><div class="mbody"></div></div></div>
<div id="toasts"></div>

<div id="title">
  <svg id="tdisc" viewBox="0 0 200 200"><g id="tdiscG"></g></svg>
  <h1 class="tt">ゴールデンレコード</h1>
  <p class="ts">A PUZZLE ABOUT THE VOYAGER GOLDEN RECORD</p>
  <p class="lead2"></p>
  <button class="btn primary" id="btnStart" style="padding:10px 34px;font-size:14px;letter-spacing:.2em">は じ め る</button>
  <p class="credit"></p>
</div>

<script>
"use strict";
/* ======================================================================
   ゴールデンレコード ― 星へのラブレター
   単一ファイル・外部リソース無し。ここから下がすべてのロジック。
   ====================================================================== */

/* ---------- 小道具 ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const el = (tag,attrs,html)=>{ const n=document.createElement(tag);
  if(typeof attrs==='string') n.className=attrs;
  else if(attrs) for(const k in attrs){ if(k==='class') n.className=attrs[k]; else n.setAttribute(k,attrs[k]); }
  if(html!=null) n.innerHTML=html; return n; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* 解答の表記ゆれ吸収: 全角→半角、カタカナ→ひらがな、記号/空白除去 */
function norm(s){
  if(s==null) return '';
  let t = String(s).trim().toLowerCase();
  t = t.replace(/[Ａ-Ｚａ-ｚ０-９．]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  t = t.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); // カタカナ→ひらがな
  t = t.replace(/[ー－—–‐]/g,'ー');   // 長音記号はまとめる（ASCIIの - は下で除去）
  // 数字にはさまれた小数点だけは残す（3.6 と 36 を別物として扱うため）
  t = t.replace(/\./g, (m, i)=> (/[0-9]/.test(t[i-1]||'') && /[0-9]/.test(t[i+1]||'')) ? '.' : '');
  t = t.replace(/[\s、。,\/\-_'"！!？?「」『』（）()\[\]]/g,'');
  t = t.replace(/[ぁぃぅぇぉっゃゅょゎ]/g, c=>'あいうえおつやゆよわ'['ぁぃぅぇぉっゃゅょゎ'.indexOf(c)]); // 小書き→大書き
  t = t.replace(/[がぎぐげござじずぜぞだぢづでどばびぶべぼ]/g, c=>'かきくけこさしすせそたちつてとはひふへほ'['がぎぐげござじずぜぞだぢづでどばびぶべぼ'.indexOf(c)]);
  t = t.replace(/[ぱぴぷぺぽ]/g, c=>'はひふへほ'['ぱぴぷぺぽ'.indexOf(c)]);
  return t;
}
function matchAns(input, answers, strict){
  const n = norm(input); if(!n) return false;
  return answers.some(a=>{ const m = norm(a);
    if(m===n) return true;
    if(strict) return false;                           // 数で答える問いは部分一致させない
    if(m.length>=2 && n.includes(m)) return true;      // 「白い丸」→「まる」
    if(n.length>=2 && m.includes(n)) return true;      // 「グリーゼ」→「グリーゼ445」
    return false; });
}
/* 「4万年後」「約四万」なども数として読む */
function numOf(str){
  let t = norm(str).replace(/やく|およそ|ほど|くらい|ぐらい/g,'');
  t = t.replace(/[〇一二三四五六七八九]/g, c=>String('〇一二三四五六七八九'.indexOf(c)));
  t = t.replace(/十/g,'0');
  const man = t.match(/([0-9]+(?:\.[0-9]+)?)\s*[万萬]/);
  if(man) return parseFloat(man[1])*10000;
  const oku = t.match(/([0-9]+(?:\.[0-9]+)?)\s*億/);
  if(oku) return parseFloat(oku[1])*1e8;
  const m = t.match(/-?[0-9]+(?:\.[0-9]+)?/);
  return m? parseFloat(m[0]) : NaN;
}

/* ---------- セーブ ---------- */
const SAVEKEY='goldenrecord.v1';
const S = {
  started:false, disc:'voyager', face:'front',
  seen:{},      // 観察済みホットスポット
  notes:[],     // 取得した記録カード id
  solved:{},    // 解けた謎 id -> true
  hints:{},     // 謎id -> 開いたヒント数
  dev:{},       // 装置の状態
  flags:{},     // 進行フラグ
};
function save(){ try{ localStorage.setItem(SAVEKEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const j=localStorage.getItem(SAVEKEY); if(j) Object.assign(S, JSON.parse(j)); }catch(e){} }
function resetAll(){ if(!confirm('最初からやり直します。よろしいですか？')) return;
  try{ localStorage.removeItem(SAVEKEY); }catch(e){} location.reload(); }

/* ---------- 通知 ---------- */
function toast(msg, kind){
  const t = el('div','toast'+(kind?' '+kind:''), msg);
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0';
    setTimeout(()=>t.remove(),420); }, 2600);
}

/* ---------- モーダル ---------- */
let modalOnClose=null;
function openModal(title, bodyNodeOrHtml, onClose){
  $('#modal h3').textContent = title;
  const b = $('#modal .mbody'); b.innerHTML='';
  if(typeof bodyNodeOrHtml==='string') b.innerHTML=bodyNodeOrHtml; else b.appendChild(bodyNodeOrHtml);
  $('#veil').classList.add('on'); modalOnClose=onClose||null;
  b.scrollTop=0; $('#modal').scrollTop=0;
}
function closeModal(){
  $('#veil').classList.remove('on');
  if(modalOnClose){ const f=modalOnClose; modalOnClose=null; f(); }
}
$('#close').onclick=closeModal;
$('#veil').addEventListener('click', e=>{ if(e.target.id==='veil') closeModal(); });

/* ---------- 星空背景 ---------- */
(function stars(){
  const c=$('#stars'), x=c.getContext('2d'); let w,h,pts=[];
  function init(){
    w=c.width=innerWidth; h=c.height=innerHeight; pts=[];
    const n=Math.round(w*h/9000);
    for(let i=0;i<n;i++) pts.push({x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*1.15+.25, a:Math.random()*.6+.15, s:Math.random()*.014+.003, p:Math.random()*6.28});
    draw(0);
  }
  function draw(t){
    x.clearRect(0,0,w,h);
    for(const p of pts){
      const a=p.a*(0.65+0.35*Math.sin(t*p.s+p.p));
      x.fillStyle='rgba(210,225,245,'+a.toFixed(3)+')';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.2832); x.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize', ()=>{ w=c.width=innerWidth; h=c.height=innerHeight; });
  init();
})();
/* ======================================================================
   SVG 作画ヘルパー：金属に刻まれた線画の質感で描く
   ====================================================================== */
const SVGNS='http://www.w3.org/2000/svg';
function svgTag(inner, extra){
  return '<svg viewBox="0 0 1000 1000" xmlns="'+SVGNS+'" '+(extra||'')+'>'+inner+'</svg>';
}
/* 2進数を | (1) と — (0) の並びで描く。
   x,y は左端・中心線。dir='h' 横書き / 'v' 縦書き。msb first。 */
function binMarks(bits, x, y, opt){
  opt = opt||{};
  const g = opt.gap || 13, len = opt.len || 20, dir = opt.dir||'h', sw = opt.sw||3.4;
  let out = '';
  for(let i=0;i<bits.length;i++){
    const b = bits[i];
    if(dir==='h'){
      const cx = x + i*g;
      out += b==='1'
        ? `<line x1="${cx}" y1="${y-len/2}" x2="${cx}" y2="${y+len/2}"/>`
        : `<line x1="${cx-g*0.27}" y1="${y}" x2="${cx+g*0.27}" y2="${y}"/>`;
    }else{
      const cy = y + i*g;
      out += b==='1'
        ? `<line x1="${x-len/2}" y1="${cy}" x2="${x+len/2}" y2="${cy}"/>`
        : `<line x1="${x}" y1="${cy-g*0.34}" x2="${x}" y2="${cy+g*0.34}"/>`;
    }
  }
  return `<g stroke-width="${sw}">${out}</g>`;
}

      <stop offset="0%" stop-color="#fff" stop-opacity=".26"/>

      <stop offset="62%" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>

}
function ringTexture(n, r0, r1, op){
  let s='';
  for(let i=0;i<n;i++){ const r=r0+(r1-r0)*i/n;
    s+=`<circle cx="500" cy="500" r="${r.toFixed(1)}" fill="none" stroke="#000" stroke-opacity="${op}" stroke-width=".7"/>`; }
  return s;
}

const HOTBOX = {};
function zoomCover(which, id, pad){
  const box = (HOTBOX[which]||{})[id]; if(!box) return '';
  pad = pad==null? 18 : pad;
  const [x,y,w,h] = box;
  const inner = which==='alien' ? alienCoverInner(false) : coverFrontInner(false);
  return `<svg viewBox="${x-pad} ${y-pad} ${w+pad*2} ${h+pad*2}" xmlns="${SVGNS}" class="fig" style="width:100%;max-width:520px;background:#c9a24a;border-radius:8px">${inner}</svg>`;

/* 円周に沿って2進数を刻む（1=半径方向の線 / 0=接線方向の短い線）
   start: 開始角[deg] (0=東, 増える方向が画面上の時計回り), step: 1桁あたりの角度
   skip : [from,to] この角度範囲にはカートリッジがあるので刻まない */
function rimBinary(cx, cy, r, bits, start, step, skip){
  let out='', ang=start, i=0, guard=0;
  while(i<bits.length && guard++<400){
    const a = ((ang%360)+360)%360;
    const inSkip = skip && (skip[0]>skip[1] ? (a>=skip[0]||a<=skip[1]) : (a>=skip[0]&&a<=skip[1]));
    if(!inSkip){
      const rad=a*Math.PI/180, c=Math.cos(rad), sn=Math.sin(rad);
      if(bits[i]==='1'){
        out += `<line x1="${(cx+c*(r-9)).toFixed(1)}" y1="${(cy+sn*(r-9)).toFixed(1)}" x2="${(cx+c*(r+9)).toFixed(1)}" y2="${(cy+sn*(r+9)).toFixed(1)}" stroke-width="2.6"/>`;
      }else{
        const a1=(a-2.6)*Math.PI/180, a2=(a+2.6)*Math.PI/180;
        out += `<line x1="${(cx+Math.cos(a1)*r).toFixed(1)}" y1="${(cy+Math.sin(a1)*r).toFixed(1)}" x2="${(cx+Math.cos(a2)*r).toFixed(1)}" y2="${(cy+Math.sin(a2)*r).toFixed(1)}" stroke-width="2.6"/>`;
      }
      i++;
    }
    ang += step;
  }
  return `<g>${out}</g>`;
}
/* 2進数を複数行に折り返して刻む（行の区切りは rows で指定） */
function binRows(bits, rows, x, y, opt){
  let out='', p=0;
  for(let r=0;r<rows.length;r++){
    out += binMarks(bits.slice(p, p+rows[r]), x, y + r*(opt.lh||20), opt);
    p += rows[r];
  }
  return `<g>${out}</g>`;
}

/* パルサー地図：14本の線＋銀河中心への1本
   bin/P は実物のジャケットから読み取られた本物の値。
   deg = 銀河中心方向の線から測った角度、sgn = その線の上下、d = 相対距離（銀河中心=100）
   pdot = 1秒あたり何秒周期が伸びるか（実測値。異星の円盤の年代決定に使う） */
const PULSARS = [
  {i:1, id:'B1727-47', bin:'1000110001111100100011011101010',  P:0.829683, deg: 17, sgn:-1, d:27, pdot:1.636e-13},
  {i:2, id:'B1451-68', bin:'10110010011000101011101101111',    P:0.263377, deg: 49, sgn: 1, d: 2, pdot:9.8e-17},
  {i:3, id:'B1240-64', bin:'100000110110010110001001111000',   P:0.388000, deg: 58, sgn:-1, d:56, pdot:4.5006e-15},
  {i:4, id:'B0833-45', bin:'111100011011011001010100111',      P:0.089219, deg: 95, sgn: 1, d:15, pdot:1.25008e-13},
  {i:5, id:'B0950+08', bin:'10101011011001101100101000011',    P:0.253065, deg:129, sgn:-1, d: 1, pdot:2.29758e-16},
  {i:6, id:'B0823+26', bin:'101100111011010101011110001011',   P:0.530660, deg:162, sgn: 1, d: 2, pdot:1.7e-15},
  {i:7, id:'B0531+21', bin:'10110011100000101010000010',       P:0.033130, deg:174, sgn:-1, d:18, pdot:4.22765e-13},
  {i:8, id:'B0525+21', bin:'100111101000110101000100111000100',P:3.745491, deg:177, sgn: 1, d:11, pdot:4.00530e-14},
  {i:9, id:'B0329+54', bin:'111100011111100011111000010110',   P:0.714519, deg:145, sgn: 1, d: 7, pdot:2.048265e-15},
  {i:10,id:'B2217+47', bin:'101101100101101001000010110001',   P:0.538467, deg: 97, sgn:-1, d:10, pdot:2.8e-15},
  {i:11,id:'B2016+28', bin:'101111001111001110011000001101',   P:0.557953, deg: 68, sgn: 1, d: 3, pdot:1.5e-16},
  {i:12,id:'B1933+16', bin:'11110010111110001110100011110',    P:0.358735, deg: 52, sgn:-1, d:40, pdot:6.0e-15},
  {i:13,id:'B1929+10', bin:'10011001011010111010010111000',    P:0.226517, deg: 45, sgn: 1, d: 1, pdot:1.157426e-15},
  {i:14,id:'B1642-03', bin:'100000110100101010001110101100',   P:0.387689, deg: 16, sgn:-1, d: 4, pdot:1.8e-15},
];
const relLen = d => 0.42 + 0.58*Math.sqrt(d/56);

function pulsarMapSVG(cx, cy, scale, E, opt){
  opt = opt||{};
  const R = 168*scale, list = opt.list||PULSARS;
  let s = `<g>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${4.5*scale}" fill="${E}" stroke="none"/>`;
  for(const p of list){
    const a = (p.deg*p.sgn)*Math.PI/180, L = R*relLen(p.d);
    const c=Math.cos(a), sn=Math.sin(a);
    const x2 = cx+c*L, y2 = cy+sn*L;
    s += `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${2.4*scale}"/>`;
    const bits = p.bin;
    const step = (L-16*scale)/bits.length;
    const nx = -sn, ny = c;
    for(let i=0;i<bits.length;i++){
      const dd = 12*scale + step*i;
      const bx = cx+c*dd, by = cy+sn*dd;
      if(bits[i]==='1'){
        s += `<line x1="${(bx-nx*4.6*scale).toFixed(1)}" y1="${(by-ny*4.6*scale).toFixed(1)}" x2="${(bx+nx*4.6*scale).toFixed(1)}" y2="${(by+ny*4.6*scale).toFixed(1)}" stroke-width="${1.7*scale}"/>`;
      }else{
        s += `<line x1="${(bx-c*1.9*scale).toFixed(1)}" y1="${(by-sn*1.9*scale).toFixed(1)}" x2="${(bx+c*1.9*scale).toFixed(1)}" y2="${(by+sn*1.9*scale).toFixed(1)}" stroke-width="${1.7*scale}"/>`;
      }
    }
    // 線の端の目盛＝銀河面からのずれ
    const z = ((p.i*37)%13-6)*1.1*scale;
    s += `<line x1="${x2.toFixed(1)}" y1="${y2.toFixed(1)}" x2="${(x2+nx*z).toFixed(1)}" y2="${(y2+ny*z).toFixed(1)}" stroke-width="${2*scale}"/>`;
  }
  // 銀河中心へ伸びる線（2進数が付かない唯一の線）
  s += `<line x1="${cx}" y1="${cy}" x2="${(cx+R*1.5).toFixed(1)}" y2="${cy}" stroke-width="${3.2*scale}"/>`;
  s += `</g>`;
  return s;
}

/* 水素原子の超微細遷移図（実物の描写：左＝電子と陽子が逆向き／右＝同じ向き） */
function hydrogenSVG(cx, cy, E, scale){
  const k = scale||1, d = 78*k, r = 46*k;
  const arrow = (x,y,dir)=>{      // dir=-1:上向き / +1:下向き
    const h = 15*k, t = 5*k;
    return `<line x1="${x}" y1="${y-dir*h}" x2="${x}" y2="${y+dir*h}" stroke-width="${2.6*k}"/>`
         + `<path d="M${x} ${y+dir*(h+t)} l${-t} ${-dir*t} l${2*t} 0 z" fill="${E}" stroke="none"/>`;
  };
  let s = `<g>`;
  // 左：電子が上向き・陽子が下向き（逆平行＝低いほうの状態）
  // 右：電子も陽子も下向き（平行＝高いほうの状態）
  [[-1,-1,1],[1,1,1]].forEach(([sgn, eDir, pDir])=>{
    const x = cx + sgn*d, ey = cy - r;
    s += `<circle cx="${x}" cy="${cy}" r="${r}"/>`;
    s += `<circle cx="${x}" cy="${cy}" r="${8*k}" fill="${E}" stroke="none"/>`;   // 陽子
    s += arrow(x + 20*k, cy, pDir);
    s += `<circle cx="${x}" cy="${ey}" r="${6.5*k}" fill="${E}" stroke="none"/>`; // 電子
    s += arrow(x + 18*k, ey, eDir);
  });
  // 2つの状態を結ぶ線と、その中央から下に垂れる「1」
  s += `<line x1="${cx-d+r}" y1="${cy}" x2="${cx+d-r}" y2="${cy}" stroke-width="${2.8*k}"/>`;
  s += `<line x1="${cx}" y1="${cy+3*k}" x2="${cx}" y2="${cy+40*k}" stroke-width="${3.2*k}"/>`;
  s += `</g>`;
  return s;
}

function alienDigits(n){

function alienNumWidth(n, gap, bar){
  bar = bar||7;
  const ds = alienDigits(n);
  return ds.reduce((a,d)=> a + (d===0?22:(d-1)*bar+4), 0) + gap*(ds.length-1);

function drawAlienNumOnCanvas(g, n, cx, cy, h, gap, bar){
  const ds = alienDigits(n); bar = bar||7;
  const wOf = d => d===0 ? 22 : (d-1)*bar+4;
  let total = ds.reduce((a,d)=>a+wOf(d),0) + gap*(ds.length-1);
  let x = cx - total/2;
  for(const d of ds){
    if(d===0){ g.beginPath(); g.moveTo(x,cy); g.lineTo(x+22,cy); g.stroke(); x+=22; }
    else { for(let i=0;i<d;i++){ g.beginPath(); g.moveTo(x+i*bar,cy-h); g.lineTo(x+i*bar,cy+h); g.stroke(); } x+=(d-1)*bar+4; }
    x += gap;
  }
}

/* ======================================================================
   走査 ― 絵を1本の信号に変える／信号から絵に戻す
   ====================================================================== */
const SR = 46046;               // 標本化周波数[Hz]（1本8.3396ms = 384標本）
function bitmapOf(pic){
  const c = pxCanvas(IMGW, IMGH), g = c.getContext('2d');
  pic.draw(g);
  const d = g.getImageData(0,0,IMGW,IMGH).data;
  const a = new Uint8Array(IMGW*IMGH);
  for(let i=0;i<a.length;i++) a[i] = d[i*4];
  return a;
}
/* 縦走査：列ごとに上から下へ。各列の先頭標本は同期パルス(255) */
function encodePics(pics, opt){
  opt = opt||{};
  const horiz = !!opt.horiz, inv = !!opt.invert;
  const per = horiz ? IMGW : IMGH;
  const nl  = horiz ? IMGH : IMGW;
  const out = new Uint8Array(pics.length*per*nl);
  let o=0;
  for(const pic of pics){
    const bm = bitmapOf(pic);
    for(let li=0; li<nl; li++){
      for(let s=0; s<per; s++){
        let v = horiz ? bm[li*IMGW+s] : bm[s*IMGW+li];
        if(inv) v = 255-v;
        out[o++] = s===0 ? 255 : v;
      }
    }
  }
  return out;
}
/* プレイヤーの設定で信号を絵に戻す */
function decodeToCanvas(cv, sig, start, p){
  const len = Math.max(8, Math.round(p.lineLen));

  const cx = cv.getContext('2d');
  const id = cx.createImageData(w,h);

    if(p.invert) v = 255-v;
    const li=Math.floor(i/len), pos=i%len;
    const px = p.horiz ? pos : li, py = p.horiz ? li : pos;
    const oo=(py*w+px)*4;
    id.data[oo]=id.data[oo+1]=id.data[oo+2]=v; id.data[oo+3]=255;
  }
  const tmp = pxCanvas(w,h); tmp.getContext('2d').putImageData(id,0,0);
  cx.imageSmoothingEnabled=false;
  cx.fillStyle='#05070b'; cx.fillRect(0,0,cv.width,cv.height);
  const sc = Math.min(cv.width/w, cv.height/h);
  cx.drawImage(tmp,(cv.width-w*sc)/2,(cv.height-h*sc)/2,w*sc,h*sc);
}

const YEAR_S = 3.15576e7;
const ALIEN_DT = 40000 * YEAR_S;          // 彼らの地図はボイジャーの地図の4万年後
/* 彼らの数値は、地球の秒では半端。だが彼らの底（8）では 8の冪＝いちばん綺麗な数になる */
const ALIEN_ROT_S  = Math.pow(8,11)*F.H_T;   // 8^11 単位 ≒ 6.0475 秒／回転
const ALIEN_SCAN_S = Math.pow(8,8)*F.H_T;    // 8^8  単位 ≒ 11.81 ミリ秒／走査線

/* 彼らの地図に載っている6つのパルサー（ボイジャーと同じ天体・周期だけが伸びている） */
const ALIEN_PSR = [9,8,13,5,11,10].map((i,k)=>{
  const p = PULSARS.find(x=>x.i===i);
  return { i:p.i, id:p.id, P: p.P + p.pdot*ALIEN_DT,
           deg: p.deg + [2.6,-5.4,3.8,-2.1,4.1,-3.2][k], sgn:p.sgn, d:p.d };
});

/* 彼らの数字：1桁 = 縦棒 n 本（0 は横棒）、8 で桁上がり */
function alienNumSVG(n, x, y, opt){
  opt=opt||{}; const k=opt.k||1, h=opt.h||13, bar=7*k, gap=opt.gap||20*k;
  let out='', cx=x;
  for(const d of alienDigits(n)){
    if(d===0){ out += `<line x1="${cx}" y1="${y}" x2="${cx+16*k}" y2="${y}" stroke-width="${2.6*k}"/>`; cx+=16*k; }
    else { for(let i=0;i<d;i++) out += `<line x1="${cx+i*bar}" y1="${y-h*k}" x2="${cx+i*bar}" y2="${y+h*k}" stroke-width="${2.4*k}"/>`;
           cx += (d-1)*bar+3*k; }
    cx += gap;
  }
  return `<g>${out}</g>`;
}
/* 円周に沿って彼らの数字を刻む */
function alienRimNum(cx, cy, r, n, start, step){
  let out='', ang=start;
  const put=(a,len,perp)=>{
    const rad=a*Math.PI/180, c=Math.cos(rad), s=Math.sin(rad);
    if(perp) return `<line x1="${(cx+c*(r-len)).toFixed(1)}" y1="${(cy+s*(r-len)).toFixed(1)}" x2="${(cx+c*(r+len)).toFixed(1)}" y2="${(cy+s*(r+len)).toFixed(1)}" stroke-width="2.4"/>`;
    const a1=(a-2.4)*Math.PI/180, a2=(a+2.4)*Math.PI/180;
    return `<line x1="${(cx+Math.cos(a1)*r).toFixed(1)}" y1="${(cy+Math.sin(a1)*r).toFixed(1)}" x2="${(cx+Math.cos(a2)*r).toFixed(1)}" y2="${(cy+Math.sin(a2)*r).toFixed(1)}" stroke-width="2.4"/>`;
  };
  for(const d of alienDigits(n)){
    if(d===0){ out += put(ang,0,false); ang += step*1.4; }
    else { for(let i=0;i<d;i++){ out += put(ang,8,true); ang += step*0.42; } }
    ang += step*1.5;
  }
  return `<g>${out}</g>`;
}

function alienPulsarSVG(cx, cy, scale, E){
  const R=170*scale;
  let s=`<g>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${4.5*scale}" fill="${E}" stroke="none"/>`;
  for(const p of ALIEN_PSR){
    const a=(p.deg*p.sgn)*Math.PI/180, L=R*relLen(p.d);
    const c=Math.cos(a), sn=Math.sin(a), nx=-sn, ny=c;
    const x2=cx+c*L, y2=cy+sn*L;
    s += `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${2.4*scale}"/>`;
    // 彼らの数字：桁ごとに棒をまとめて刻む
    const ds = alienDigits(Math.round(p.P/F.H_T));
    let d0 = 14*scale;
    const room = (L-20*scale);
    const unit = room / ds.reduce((a,d)=>a+(d===0?1.6:d*0.55+1.2),0);
    for(const d of ds){
      if(d===0){ s+=`<line x1="${(cx+c*d0).toFixed(1)}" y1="${(cy+sn*d0).toFixed(1)}" x2="${(cx+c*(d0+unit*0.9)).toFixed(1)}" y2="${(cy+sn*(d0+unit*0.9)).toFixed(1)}" stroke-width="${1.6*scale}"/>`; d0+=unit*1.6; }
      else{ for(let i=0;i<d;i++){ const dd=d0+i*unit*0.55;
              s+=`<line x1="${(cx+c*dd-nx*4*scale).toFixed(1)}" y1="${(cy+sn*dd-ny*4*scale).toFixed(1)}" x2="${(cx+c*dd+nx*4*scale).toFixed(1)}" y2="${(cy+sn*dd+ny*4*scale).toFixed(1)}" stroke-width="${1.5*scale}"/>`; }
            d0 += d*unit*0.55 + unit*1.2; }
    }
  }
  // 銀河中心へ伸びる長い線
  s += `<line x1="${cx}" y1="${cy}" x2="${(cx+R*1.5).toFixed(1)}" y2="${(cy-R*0.06).toFixed(1)}" stroke-width="${3*scale}"/>`;
  // 刻みが無く、先端に小さな丸だけが付いた線（＝パルサーではない何か）
  const sa=-118*Math.PI/180, sl=R*0.78;
  const sx2=cx+Math.cos(sa)*sl, sy2=cy+Math.sin(sa)*sl;
  s += `<line x1="${cx}" y1="${cy}" x2="${sx2.toFixed(1)}" y2="${sy2.toFixed(1)}" stroke-width="${2.4*scale}"/>`;
  s += `<circle cx="${sx2.toFixed(1)}" cy="${sy2.toFixed(1)}" r="${7*scale}"/>`;
  s += `<circle cx="${sx2.toFixed(1)}" cy="${sy2.toFixed(1)}" r="${2.4*scale}" fill="${E}" stroke="none"/>`;
  s += `</g>`;
  return s;
}

/* ======================================================================
   音 ― すべてその場で合成する
   ====================================================================== */
const AU = { ctx:null, on:false, nodes:[], kind:null };
function auCtx(){ if(!AU.ctx){ try{ AU.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AU.ctx && AU.ctx.state==='suspended') AU.ctx.resume(); return AU.ctx; }
function noiseBuf(ctx, sec, color){
  const n = Math.floor(ctx.sampleRate*sec), b = ctx.createBuffer(1,n,ctx.sampleRate), d = b.getChannelData(0);
  let last=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; last = color? (last*0.96+w*0.04) : w; d[i]= color? last*3 : w; }
  return b;
}
function auStop(){
  AU.gen = (AU.gen||0)+1;               // 走っているシーケンスを無効にする
  clearTimeout(AU.seqT); AU.seqT=null;
  AU.on=false; AU.kind=null;
  for(const n of AU.nodes){ try{ n.stop? n.stop() : n.disconnect(); }catch(e){} }
  AU.nodes=[];
}
function auPlay(kind, speed){
  const ctx = auCtx(); if(!ctx) return;
  auStop(); AU.on=true; AU.kind=kind;
  speed = speed||1;
  const out = ctx.createGain(); out.gain.value=0.0001; out.connect(ctx.destination);
  out.gain.linearRampToValueAtTime(0.5, ctx.currentTime+0.25);
  AU.nodes.push(out);
  // レコード面のノイズ（常時）
  const hiss = ctx.createBufferSource(); hiss.buffer=noiseBuf(ctx,2,true); hiss.loop=true;
  const hg = ctx.createGain(); hg.gain.value=0.05;
  hiss.connect(hg).connect(out); hiss.start(); AU.nodes.push(hiss);

  if(kind==='video'){
    // 走査のパルス列＝耳ざわりな唸り
    const o1=ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=120*speed;
    const o2=ctx.createOscillator(); o2.type='square';   o2.frequency.value=1920*speed;
    const g1=ctx.createGain(); g1.gain.value=.16; const g2=ctx.createGain(); g2.gain.value=.05;
    const lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=3.1;
    const lg=ctx.createGain(); lg.gain.value=.04; lfo.connect(lg).connect(g2.gain);
    o1.connect(g1).connect(out); o2.connect(g2).connect(out);
    o1.start(); o2.start(); lfo.start(); AU.nodes.push(o1,o2,lfo);
  }else if(kind==='earth'){
    const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,3,true); n.loop=true;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=420; f.Q.value=1.4;
    const lfo=ctx.createOscillator(); lfo.frequency.value=.13;
    const lg=ctx.createGain(); lg.gain.value=260; lfo.connect(lg).connect(f.frequency);
    const g=ctx.createGain(); g.gain.value=.5;
    n.connect(f).connect(g).connect(out); n.start(); lfo.start(); AU.nodes.push(n,lfo);
  }else if(kind==='music'){
    const sc=[0,2,4,7,9,12,14,16], base=196*speed;
    const o=ctx.createOscillator(); o.type='triangle';
    const g=ctx.createGain(); g.gain.value=.001;
    o.connect(g).connect(out); o.start(); AU.nodes.push(o);
    let i=0; const gen=AU.gen||0;
    const seq=()=>{ if(!AU.on||AU.kind!=='music'||(AU.gen||0)!==gen) return;
      const t=ctx.currentTime, n=sc[(i*3+ (i>>3))%sc.length];
      o.frequency.setValueAtTime(base*Math.pow(2,n/12), t);
      g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(.16,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.42); i++;
      AU.seqT = setTimeout(seq, 300); };
    seq();
  }else if(kind==='greet'){
    // 母音のような音のつらなり（言語が変わるたびに音色が変わる）
    const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=128;
    const f1=ctx.createBiquadFilter(); f1.type='bandpass'; f1.Q.value=7;
    const g=ctx.createGain(); g.gain.value=.001;
    o.connect(f1).connect(g).connect(out); o.start(); AU.nodes.push(o);
    let i=0; const gen=AU.gen||0;
    const seq=()=>{ if(!AU.on||AU.kind!=='greet'||(AU.gen||0)!==gen) return;
      const t=ctx.currentTime;
      f1.frequency.setValueAtTime([620,980,1480,760,540][i%5], t);
      o.frequency.setValueAtTime(112+ (i%4)*17, t);
      g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(.001,t);
      g.gain.linearRampToValueAtTime(.2,t+.06); g.gain.linearRampToValueAtTime(.001,t+.34);
      i++; AU.seqT=setTimeout(seq, 380); };
    seq();
  }
}
function speak(text){
  try{
    if(!window.speechSynthesis) return false;
    const ja = speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));
    if(!ja) return false;                 // 日本語の声がない環境では鳴らさない
    const u = new SpeechSynthesisUtterance(text);
    u.voice=ja; u.lang='ja-JP'; u.rate=.92; u.pitch=1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u); return true;
  }catch(e){ return false; }
}

function noteAdd(id, t, v){
  if(S.notes.some(n=>n.id===id)) return;
  S.notes.push({id, t: typeof t==='function'? t() : t, v: typeof v==='function'? v() : v});
  save(); renderNotes(); toast('記録に追加：'+t);
}
function flag(k){ if(S.flags[k]) return false; S.flags[k]=true; save(); return true; }

function solveQuest(id, silent){
  if(S.solved[id]) return;
  S.solved[id]=true; save();
  const q=Q(id);
  if(q.note) noteAdd('qn_'+id, q.note.t, q.note.v);
  renderQuests(); renderProgress();
  if(!silent) toast('正解：'+q.q.replace(/【.*?】/,''), 'ok');
  if(q.done) setTimeout(()=>toast(q.done), 900);
  if(id==='q6') setTimeout(part1Clear, 1200);
  if(id==='e7') setTimeout(ending, 1200);
  checkUnlocks();
}

function renderQuests(){

    box.innerHTML = `<div class="q">${q.q}</div>`;
    if(done){
      const shown = el('div','mono'); shown.style.cssText='color:var(--green);font-size:12px';
      shown.textContent = q.ansShown || (q.ans[0]+(q.unit||''));

      btn.onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });

      for(let i=0;i<nh;i++) hb.appendChild(el('div','hinttext','ヒント'+(i+1)+'：'+q.hints[i]));

        b.onclick=()=>{ S.hints[q.id]=nh+1; save(); renderQuests(); };
        hb.appendChild(b);
      }
      box.appendChild(hb);

function tryAnswer(q, inp){
  const v = inp.value.trim();
  if(!v) return;
  let ok = false;
  if(q.num){ const f = numOf(v); if(!isNaN(f) && f>=q.num[0] && f<=q.num[1]) ok = true; }
  if(!ok) ok = matchAns(v, q.ans, !!q.num);
  if(ok && q.needFlag && !S.flags[q.needFlag]){
    toast('その言葉が本当にこの盤に入っているのか、自分の耳で確かめよう','ng');
    return;
  }
  if(ok){ q.ansShown = v; solveQuest(q.id); }
  else { inp.style.borderColor='var(--red)'; toast('ちがうようだ','ng');
    setTimeout(()=>inp.style.borderColor='', 700); }
}

function observe(hsId){
  const key = (S.disc==='alien' && OBS['a'+hsId]) ? 'a'+hsId
            : (S.disc==='alien' && hsId==='scanNum') ? 'scanNumA' : hsId;
  const o = OBS[key] || OBS[hsId];
  if(!o) return;
  const box = el('div');
  if(o.z) box.innerHTML += zoomCover(o.z[0], o.z[1]);
  if(o.fig==='countTable') box.innerHTML += countTableSVG();
  box.innerHTML += o.body;
  if(o.marks){
    box.appendChild(marksReader(o.marks.bits, o.marks.cap, o.note));
  }
  if(o.marks2){
    box.appendChild(marksReader(o.marks2.bits, o.marks2.cap, null));
  }
  if(o.marksA){
    box.appendChild(alienReader(o.marksA.n(), o.marksA.cap, o.note));
  }
  if(o.marksA2){
    for(const m of o.marksA2) box.appendChild(alienReader(m.n(), m.cap));
  }
  if(o.psrList) box.appendChild(psrListReader(o.psrList==='alien'));
  if(o.note && !o.marks && !o.marksA) noteAdd(o.note.id, o.note.t, o.note.v);
  if(o.unlock){
    const before = openDevices();
    if(flag(o.unlock)){
      checkUnlocks();
      const now = openDevices().filter(n=>!before.includes(n));
      if(now.length) setTimeout(()=>toast('「'+now.join('」「')+'」が使えるようになった'),700);
    }
  }
  S.seen[S.disc+':'+hsId]=true; save();
  $$('.hot').forEach(h=>{ if(S.seen[S.disc+':'+h.dataset.hs]) h.classList.add('seen'); });
  openModal(o.t, box);
}
function sendToCalc(v, base, label){
  S.dev.calcPreset = {v:String(v), base:base||2}; save();
  toast((label||'この数')+'を計算機に送った');
}
/* 刻みを拡大して見せ、押すと記録に書き写す */
function marksReader(bits, cap, note){
  const d = el('div');
  const per = 22;
  let rows='';
  for(let i=0;i<bits.length;i+=per){
    rows += `<div class="markrow">`+bits.slice(i,i+per).split('').map(b=>
      `<span class="mk ${b==='1'?'one':'zero'}"></span>`).join('')+`</div>`;
  }
  d.innerHTML = `<div class="marks"><div class="cap">${cap}</div>${rows}</div>`;
  const row = el('div','ctlrow');
  const b = el('button','btn','記録に書き写す');
  b.onclick = ()=>{
    if(note) noteAdd(note.id, note.t, bits);
    else noteAdd('n_'+bits.slice(0,8), cap, bits);
    b.disabled=true; b.textContent='書き写した';
  };
  const b2 = el('button','btn primary','計算機に送る');
  b2.onclick = ()=> sendToCalc(bits, 2, cap);
  row.appendChild(b); row.appendChild(b2);
  d.appendChild(row);
  return d;
}
function alienReader(n, cap, note){
  const ds = alienDigits(n);
  const d = el('div');
  d.innerHTML = `<div class="marks"><div class="cap">${cap}</div>
    <div class="markrow">${ds.map(x=>`<span class="grp">${x===0?'—':'｜'.repeat(x)}</span>`).join('')}</div></div>`;
  const row = el('div','ctlrow');
  const b = el('button','btn','記録に書き写す');
  b.onclick=()=>{ const v=ds.join(' ');
    noteAdd(note? note.id : ('na_'+n), note? note.t : cap, v);
    b.disabled=true; b.textContent='書き写した'; };
  const b2 = el('button','btn primary','計算機に送る');
  b2.onclick=()=> sendToCalc(ds.join(''), 8, cap);
  row.appendChild(b); row.appendChild(b2);
  d.appendChild(row);
  return d;
}
/* 地図の線を1本ずつ書き出す（線に沿った刻みを目で追う作業の代わり） */
function psrListReader(alien){
  const list = alien? ALIEN_PSR : PULSARS;
  const d = el('div');
  const rows = list.map((p,i)=>{
    const bits = p.bin || Math.round(p.P/F.H_T).toString(2);
    const n = parseInt(bits,2);
    const txt = alien ? alienDigits(Math.round(p.P/F.H_T)).map(x=>x===0?'—':'｜'.repeat(x)).join(' ')
                      : bits.replace(/1/g,'｜').replace(/0/g,'—');
    return `<tr data-i="${i}" style="cursor:pointer"><td style="white-space:nowrap">${i+1}本目 ▸</td>`+
      `<td class="mono" style="font-size:10px;word-break:break-all;letter-spacing:-1px">${txt}</td></tr>`;
  }).join('');
  d.innerHTML = `<p class="dim">線に沿った刻みを1本ずつ書き写した（${alien?'かたまりごとに区切ってある':'左が上位の桁'}）。
    <b>行を押すと、その数を計算機に送る。</b></p>
    <div style="max-height:260px;overflow:auto"><table class="tbl">${rows}</table></div>
    <p class="dim">短い列ほど小さい数＝速く回っている天体。</p>`;
  d.querySelectorAll('tr[data-i]').forEach(tr=> tr.onclick=()=>{
    const p=list[+tr.dataset.i];
    sendToCalc(alien? alienDigits(Math.round(p.P/F.H_T)).join('') : (p.bin||Math.round(p.P/F.H_T).toString(2)),
      alien?8:2, (+tr.dataset.i+1)+'本目の数');
  });
  return d;
}
function countTableSVG(){
  let s='';
  for(let n=1;n<=9;n++){
    const y=30+(n-1)*34;
    for(let i=0;i<n;i++) s+=`<circle cx="${40+i*26}" cy="${y}" r="7" fill="#0e1620"/>`;
    s+=`<line x1="290" y1="${y-13}" x2="290" y2="${y+13}" stroke="#0e1620" stroke-width="2" opacity=".3"/>`;
    s+=`<g stroke="#0e1620" fill="none" stroke-linecap="round">${alienNumSVG(n,330,y,{k:1.1,h:11,gap:22})}</g>`;
  }
  return `<svg viewBox="0 0 520 330" class="fig" style="width:100%;max-width:420px;background:#9aa6b4;border-radius:8px;padding:6px">${s}</svg>`;
}

    const rotSet=parseFloat(S.dev['rot_'+S.disc])||0;
    const sp = rotSet>0 ? d.rot/rotSet : 1;
    auPlay(b.kind, sp);
    if(fromButton && Math.abs(rotSet-d.rot) < Math.max(0.008, d.rot*0.004)) checkVoice(t);
  };
  let auT=null;
  const restart=()=>{ clearTimeout(auT); auT=setTimeout(()=>{ if(AU.on) startPlay(false); }, 200); };
  pos.oninput = ()=>{ slide.value=pos.value; update(); restart(); };
  slide.oninput= ()=>{ pos.value=slide.value; update(); restart(); };
  $('#tGo').onclick=()=>{
    const rev=parseFloat($('#tRev').value), rs=parseFloat(S.dev['rot_'+S.disc])||0;
    if(!(rev>0)||!(rs>0)){ toast('先に1回転の時間と、回転数を入れよう','ng'); return; }
    pos.value=(rev*rs).toFixed(1); slide.value=pos.value; update();
    toast(rev+' 回転目 ＝ '+(rev*rs).toFixed(1)+' 秒');
  };
  $('#tPlay').onclick=()=>startPlay(true);
  $('#tStop').onclick=()=>{ auStop(); };
  showRot(); update();
}
function greetIndexAt(t){
  const d=curDisc(), b=d.bands.find(x=>x.kind==='greet'); if(!b) return -1;
  const each = (b.t1-b.t0)/GREETS.length;
  return Math.floor((t-b.t0)/each);
}

function checkVoice(t){
  const d=curDisc();
  const rotSet = parseFloat(S.dev['rot_'+S.disc])||d.rot;
  // 「何回転目か」で判定する。プレイヤーが使った回転時間でも、正しい値でも合えばよい

/* 入力された周期の集合から、矛盾のない「測定年」を探す */
function starAnalyze(all){
  const raw  = all.map(p => PULSARS.map(q=>({q, t:(p-q_now(q))/q.pdot/YEAR_S}))
                              .filter(c=>Math.abs(c.t)<100000));
  const bad  = all.filter((_,i)=>!raw[i].length);
  const ps   = all.filter((_,i)=> raw[i].length);
  const cand = raw.filter(c=>c.length);
  const note = bad.length
    ? String.fromCharCode(10,10)+'※ '+bad.join(' / ')+' 秒 は、どの天体の周期変化でも説明がつかない。'
      +String.fromCharCode(10)+'　 読み間違いかもしれないので、この値は外して照合した。'
    : '';
  if(!cand.length) return {text:'どの天体の周期変化でも説明がつかない。線の刻みをもう一度確かめよう。', epoch:null};
  let best=null;
  for(const c0 of cand[0]){
    let err=0, ok=true, picks=[c0];
    for(let i=1;i<cand.length;i++){
      let b=null;
      for(const c of cand[i]) if(!b || Math.abs(c.t-c0.t)<Math.abs(b.t-c0.t)) b=c;
      const tol = Math.max(400, Math.abs(c0.t)*0.05);
      if(!b || Math.abs(b.t-c0.t) > tol){ ok=false; break; }
      err += Math.abs(b.t-c0.t); picks.push(b);
    }
    if(ok && (!best || err<best.err)) best={err, picks, t:c0.t};
  }
  let s='';
  if(!best){
    s = '入力された周期どうしで、年代が一致しない。\n';
    s += ps.map((p,i)=>` ${i+1}) ${p} 秒 → 候補 ` +
      cand[i].map(c=>`${c.q.id}（${c.t>0?'+':''}${c.t.toFixed(0)}年）`).join(' / ')).join('\n');
    s += '\n\n※ 読み間違いがあるかもしれない。もう一度、線の刻みを確かめよう。';
    return {text:s+note, epoch:null};
  }
  if(cand[0].length>1 && ps.length<2){
    s  = `${ps[0]} 秒 に当てはまる天体が複数ある：\n`;
    s += cand[0].map(c=>`　${c.q.id}　… その場合この値は ${c.t>0?'約'+c.t.toFixed(0)+'年 先':'約'+(-c.t).toFixed(0)+'年 前'} のもの`).join('\n');
    s += '\n\n→ どれが正しいかは、1本では決まらない。\n　 同じ地図の別の線の周期も入れてほしい。年代が一致する組み合わせは一つしかない。';
    return {text:s+note, epoch:null};
  }
  const t = best.picks.reduce((a,c)=>a+c.t,0)/best.picks.length;
  s  = '矛盾のない組み合わせが見つかった。\n';
  s += best.picks.map((c,i)=>`　${ps[i]} 秒 ＝ ${c.q.id}（いまの周期 ${q_now(c.q).toFixed(6)} 秒）`).join('\n');
  s += `\n\n→ この地図の数値が刻まれたのは\n　 いまから 約 ${Math.abs(t).toFixed(0)} 年 ${t<0?'前':'後'}`;
  s += `（西暦 ${(2026.6+t).toFixed(0)} 年ごろ）`;
  if(t>1000) s += '\n\n※ 「後」――つまり未来に刻まれた値である。装置の異常ではない。';
  return {text:s+note, epoch:2026.6+t, years:t};
}
function q_now(p){
  // 1970年ごろに測られた地図の値から、2026年の値を推定する
  return p.P + p.pdot*(56.6*YEAR_S);
}

/* 異星の円盤の記録面 */
function alienBack(){
  let s = `<defs>
    <radialGradient id="gAB" cx="44%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#c3ccd6"/><stop offset="34%" stop-color="#8b97a5"/>
      <stop offset="72%" stop-color="#57626f"/><stop offset="100%" stop-color="#2f3843"/>
    </radialGradient></defs>`;
  s += `<circle cx="500" cy="500" r="499" fill="url(#gAB)"/>`;
  const bands=[[300,492,.40,120,1.5],[176,296,.24,64,1.6]];
  for(const [r0,r1,op,n,w] of bands){
    for(let i=0;i<n;i++){ const r=r0+(r1-r0)*i/n;
      s+=`<circle cx="500" cy="500" r="${r.toFixed(1)}" fill="none" stroke="#141a22" stroke-opacity="${op}" stroke-width="${w}"/>`;
      s+=`<circle cx="500" cy="500" r="${(r+(r1-r0)/n/2).toFixed(1)}" fill="none" stroke="#eef4fb" stroke-opacity="${op*0.45}" stroke-width="${w*0.7}"/>`; }
  }
  for(const r of [298,174]) s+=`<circle cx="500" cy="500" r="${r}" fill="none" stroke="#141a22" stroke-opacity=".6" stroke-width="3"/>`;
  s += `<circle cx="500" cy="500" r="499" fill="url(#sheenA)"/>`;
  s += `<circle cx="500" cy="500" r="170" fill="#96a3b2"/>`;
  s += `<circle cx="500" cy="500" r="170" fill="none" stroke="#2b3542" stroke-width="3"/>`;
  s += `<circle cx="500" cy="500" r="22" fill="#0a0a0a"/>`;
  // 中央には彼らの印：8方に伸びる肢
  s += `<g stroke="#131a24" fill="none" stroke-width="4" stroke-linecap="round">`;
  for(let i=0;i<8;i++){ const a=i*Math.PI/4+Math.PI/8;
    s += `<line x1="${(500+Math.cos(a)*44).toFixed(1)}" y1="${(500+Math.sin(a)*44).toFixed(1)}" x2="${(500+Math.cos(a)*118).toFixed(1)}" y2="${(500+Math.sin(a)*118).toFixed(1)}"/>`; }
  s += `<circle cx="500" cy="500" r="44"/></g>`;
  s += `<circle class="hotr" fill="none" stroke="transparent" data-hs="agrooveA" data-cap="外側の帯" cx="500" cy="500" r="396" stroke-width="192"/>`;
  s += `<circle class="hotr" fill="none" stroke="transparent" data-hs="agrooveB" data-cap="内側の帯" cx="500" cy="500" r="236" stroke-width="122"/>`;
  s += `<circle class="hot" fill="transparent" stroke="transparent" data-hs="alabel" data-cap="中央の印" cx="500" cy="500" r="170"/>`;
  return svgTag(s);
}
OBS.agrooveA={t:'外側の帯', disc:'alien', body:`<p>溝は細かく規則的。ボイジャーの円盤で「絵」が入っていた帯と、まったく同じ手ざわりだ。</p>`};
OBS.agrooveB={t:'内側の帯', disc:'alien', body:`<p>うねりが複雑で、長い繰り返しがある。ここには音が入っている。</p>`};
OBS.alabel={t:'中央の印', disc:'alien', body:`

    $('#faceBack').innerHTML  = alienBack();
    $('#discTitle').textContent = '異 星 の 円 盤';
  }
  $$('#faceFront .hot, #faceBack .hot').forEach(h=>{ if(S.seen[S.disc+':'+h.dataset.hs]) h.classList.add('seen'); });
  $$('#discCtl .pill[data-face]').forEach(x=>x.classList.toggle('on', x.dataset.face===S.face));

function renderStory(){
  const f=S.flags;
  let t;
  if(!f.rotOK) t = `深夜の解析室。机の上には、ボイジャーに積まれた金の円盤の複製と、針とカートリッジ。<b>回す装置は付いてこなかった</b>。まず、どれだけの速さで回せばいいのかを知らなければならない。`;
  else if(!f.decoded) t = `円盤は回った。音が出た。だが、最初の8分ほどは音楽でも声でもない、規則正しい唸りが続いている。<b>あれは何だ？</b>`;
  else if(!f.alien) t = `絵が出た。円、太陽系、DNA、人。1977年の人類が選んだ115枚。<b>最後の1枚まで送ってみよう。</b>`;
  else if(!f.aDecoded) t = `異星の円盤。ジャケットの図は明らかにボイジャーの模倣だ。<b>だが細部が違う。違うところにこそ、彼らの流儀がある。</b>`;
  else if(!f.cleared) t = `彼らの絵が立った。そこに写っていたものを見よ。<b>この手紙は、いつ、どこから来たのか。</b>`;
  else t = `すべて読み終えた。円盤は、まだ静かに回っている。`;
  $('#story').innerHTML = t;
}

/* --- 開発用：SVGをPNG化してサーバに保存（作画確認） --- */
if(location.port==='8131'){
  window.snap = async function(sel, name, size){
    const host = document.querySelector(sel);
    const src  = host.tagName==='svg' ? host : host.querySelector('svg');
    const c2 = src.cloneNode(true); size = size||760;
    c2.setAttribute('width', size); c2.setAttribute('height', size);
    const xml = new XMLSerializer().serializeToString(c2);
    const img = new Image();
    await new Promise((ok,ng)=>{ img.onload=ok; img.onerror=ng;
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml); });
    const c=document.createElement('canvas'); c.width=size; c.height=size;
    const x=c.getContext('2d'); x.fillStyle='#0b0d12'; x.fillRect(0,0,size,size);
    x.drawImage(img,0,0,size,size);
    const r = await fetch('/snap',{method:'POST',body:(name||'snap')+'|'+c.toDataURL('image/png')});
    return await r.text();
  };
  window.snapCanvas = async function(sel, name){
    const c = document.querySelector(sel);
    const r = await fetch('/snap',{method:'POST',body:(name||'snap')+'|'+c.toDataURL('image/png')});
    return await r.text();
  };
