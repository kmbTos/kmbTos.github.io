const keys = {}, prevKeys = {};
window.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  initAudio();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
function down(c){ return !!keys[c]; }
function pressed(c){ return !!keys[c] && !prevKeys[c]; }
function endFrameInput(){ for (const k in keys) prevKeys[k] = keys[k]; }

// ---------------------------------------------------------------- 音
let actx = null;
function initAudio(){ if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } }
function beep(freq, dur, type, vol){
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"square"; o.frequency.value = freq;
    g.gain.value = vol||0.04;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}

// ---------------------------------------------------------------- セーブ
const SAVE_KEY = "makaiHunterSaveV1";
let save = null;
function newSave(){
  return { zenny:300, mats:{}, owned:["s0","p0","h0"], equipped:"s0", cleared:{}, armorLv:0, hunts:0 };
}
function loadSave(){
  try {
    const s = localStorage.getItem(SAVE_KEY);
    save = s ? Object.assign(newSave(), JSON.parse(s)) : newSave();
  } catch(e){ save = newSave(); }
}
function commitSave(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
}
function addMat(id, n){ save.mats[id] = (save.mats[id]||0) + n; }
function questUnlocked(q){ return q.needs === undefined || save.cleared[q.needs]; }
function canCraft(cost){
  if (!cost) return false;
  if (save.zenny < cost.z) return false;
  for (const m in cost.mats) if ((save.mats[m]||0) < cost.mats[m]) return false;
  return true;
}
function payCost(cost){
  save.zenny -= cost.z;
  for (const m in cost.mats) save.mats[m] -= cost.mats[m];
}
function pickWeighted(table){
  let total = 0; for (const [,w] of table) total += w;
  let r = Math.random() * total;
  for (const [id,w] of table){ r -= w; if (r <= 0) return id; }
  return table[0][0];
}

// ---------------------------------------------------------------- 描画ヘルパ
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function text(s,x,y,size,c,align){
  ctx.fillStyle = c||"#fff";
  ctx.font = `bold ${size|0}px 'MS Gothic','Yu Gothic',monospace`;
  ctx.textAlign = align||"left";
  ctx.fillText(s,x|0,y|0);
  ctx.textAlign = "left";
}
function panel(x,y,w,h){
  ctx.fillStyle = "rgba(10,8,24,0.92)"; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = "#8877aa"; ctx.lineWidth = 2; ctx.strokeRect(x+1,y+1,w-2,h-2);
  ctx.strokeStyle = "#443366"; ctx.strokeRect(x+4,y+4,w-8,h-8);
}
function overlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function TitleScene(){
  let t = 0, delStep = 0, delMsgT = 0;
  return {
    update(){
      t++;
      if (delMsgT > 0) delMsgT--;
      if (pressed("Delete")){
        if (delStep === 0){ delStep = 1; SFX.cancel(); }
        else {
          try { localStorage.removeItem(SAVE_KEY); } catch(e){}
          loadSave(); delStep = 0; delMsgT = 180; SFX.ok();
        }
        return;
      }
      if (delStep === 1 && (pressed("KeyZ")||pressed("KeyX")||pressed("Enter"))){ delStep = 0; SFX.cursor(); return; }
      if (pressed("KeyZ") || pressed("Enter")) { SFX.ok(); setScene(VillageScene()); }

}

const GROUND_Y = 460;
const WORLD_W = 1600;

function HuntScene(quest){
  const sp = SPECIES[quest.target];
  const wpn = weaponById(save.equipped);

  // ---------------- プレイヤー
  const P = {
    x: 200, y: GROUND_Y, vx: 0, vy: 0, face: 1,
    w: 26, h: 46,
    hp: 100, maxHp: 100, potions: 5,
    state: "idle",  // idle/walk/jump/attack/roll/drink/hurt/dead/carve
    st: 0,           // 状態タイマー
    onGround: true,
    combo: 0, atkDone: false, atkId: 0, bounced: false,
    invuln: 0, rollIF: 0,
    jumpVx: 0,
    drinkHeal: 0,
  };
  // ---------------- モンスター
  const M = {
    sp, x: 1100, y: GROUND_Y, vx: 0, vy: 0, face: -1,
    hp: sp.hp, maxHp: sp.hp,
    state: "idle", st: 0, cooldown: 60,
    move: null, dead: false, deadT: 0,
    stunGauge: 0, stunThresh: sp.stunThresh, stunT: 0,
    flinchT: 0, partDmg: {head:0, body:0, tail:0},
    flinchTh: {head: sp.parts.head.flinch, body: sp.parts.body.flinch, tail: sp.parts.tail.flinch},
    tailCut: false, tailDmg: 0,
    enraged: false, lastHitId: -1,
    carves: 3, roarT: 0,
    animT: 0,
  };
  let tailObj = null; // 切断された尻尾 {x, carves}
  const projs = [], dmgNums = [], sparks = [];
  let cam = 0, shake = 0, timer = 60*60*7, t = 0;
  let phase = "intro";  // intro / fight / cleared / result / failed
  let phaseT = 0, endTimer = 0;
  let paused = false, pauseCur = 0;
  const gained = {};    // 入手素材(結果表示用)
  let banner = "", bannerT = 0;

  function setBanner(s, dur){ banner = s; bannerT = dur||90; }
  function addDmg(x, y, v, col, big){
    dmgNums.push({x, y, v, col, t:0, big});
  }
  function addSpark(x, y, col, n){
    for (let i=0;i<(n||6);i++)
      sparks.push({x, y, vx:(Math.random()-0.5)*5, vy:-Math.random()*4-1, t:0, col});
  }
  function gain(matId, n){
    addMat(matId, n||1);
    gained[matId] = (gained[matId]||0) + (n||1);
  }

  // ---------------- 部位ボックス(ワールド座標)
  function partBoxes(){
    const out = {};
    for (const pn in sp.parts){
      if (pn === "tail" && M.tailCut) continue;
      const p = sp.parts[pn];
      const cx = M.x + p.ox * M.face;
      out[pn] = { x: cx - p.w/2, y: M.y + p.oy - p.h/2, w: p.w, h: p.h, def: p };
    }
    return out;
  }
  function playerBox(){ return { x: P.x - P.w/2, y: P.y - P.h, w: P.w, h: P.h }; }

  // ---------------- プレイヤーへのダメージ
  function hurtPlayer(dmg, fromX){
    if (P.invuln > 0 || P.rollIF > 0 || P.state === "dead" || phase !== "fight") return;
    const mult = M.enraged ? 1.3 : 1.0;
    const final = Math.max(1, Math.round(dmg * mult * armorReduction(save.armorLv)));
    P.hp -= final;
    addDmg(P.x, P.y - 60, final, "#ff5555", true);
    SFX.hurt();
    shake = 10;
    P.state = "hurt"; P.st = 0;
    P.vx = (P.x < fromX ? -1 : 1) * 4; P.vy = -4; P.onGround = false;
    P.invuln = 70;
    if (P.hp <= 0){ P.hp = 0; P.state = "dead"; P.st = 0; phase = "failed"; phaseT = 0; SFX.fail(); }
  }

  // ---------------- モンスターへのダメージ
  function hitMonster(box){
    if (M.dead || M.lastHitId === P.atkId) return;
    const boxes = partBoxes();
    let best = null, bestD = 1e9;
    for (const pn in boxes){
      const b = boxes[pn];
      if (overlap(box, b)){
        const d = Math.abs((b.x+b.w/2) - (box.x+box.w/2));
        if (d < bestD){ bestD = d; best = pn; }
      }
    }
    if (!best) return;
    M.lastHitId = P.atkId;
    const part = sp.parts[best];
    const mo = MOTIONS[wpn.type][P.combo] || MOTIONS[wpn.type][0];
    const rawHz = part.hz[wpn.type];
    const raw = wpn.atk * mo.mv * rawHz;
    let ele = 0;
    if (wpn.ele) ele = wpn.eleVal * (sp.eleHz[wpn.ele]||1);
    const total = Math.max(1, Math.round(raw + ele));
    M.hp -= total;
    M.partDmg[best] += total;
    hitFlashT = 4;
    const hx = Math.max(box.x, boxes[best].x) + Math.min(box.w, boxes[best].w)/2;
    const hy = boxes[best].y + boxes[best].h/2;
    const col = rawHz < 0.5 ? "#8888aa" : (wpn.ele ? ELE_COLOR[wpn.ele] : "#ffffff");
    addDmg(hx, hy - 10, total, col, total >= 60);
    addSpark(hx, hy, col, 8);

    // 弾かれ
    if (rawHz < 0.5){
      SFX.bounce();
      P.bounced = true;
      addDmg(hx, hy - 34, "弾かれた!", "#ffaa44");
    } else {
      wpn.ele ? SFX.hitEle() : SFX.hit();
    }
    // スタン(打撃で頭)
    if (wpn.type === "blunt" && best === "head" && M.stunT <= 0){
      M.stunGauge += mo.stun;
      if (M.stunGauge >= M.stunThresh){
        M.stunGauge = 0; M.stunThresh *= 1.6;
        M.stunT = 260; M.state = "stun"; M.st = 0; M.move = null;
        addDmg(M.x, M.y - 130, "スタン!", "#ffee55");
        SFX.stun();
      }
    }
    // 尻尾切断(斬)
    if (best === "tail" && part.cuttable && !M.tailCut && wpn.type === "slash"){
      M.tailDmg += total;
      if (M.tailDmg >= part.cutHP){
        M.tailCut = true;
        tailObj = { x: M.x - 80*M.face, carves: 1 };
        addDmg(M.x - 70*M.face, M.y - 80, "尻尾切断!", "#ff8888");
        addSpark(M.x - 70*M.face, M.y - 60, "#ff6666", 14);
        SFX.flinch();
        M.flinchT = 50; M.state = "flinch"; M.st = 0; M.move = null;
      }
    }
    // 怯み
    if (M.partDmg[best] >= M.flinchTh[best] && M.state !== "stun"){
      M.partDmg[best] = 0;
      M.flinchTh[best] = Math.round(M.flinchTh[best] * 1.7);
      if (M.flinchT <= 0){
        M.flinchT = 45; M.state = "flinch"; M.st = 0; M.move = null;
        SFX.flinch();
      }
    }
    // 討伐
    if (M.hp <= 0){
      M.hp = 0; M.dead = true; M.state = "dead"; M.st = 0; M.move = null;
      phase = "cleared"; phaseT = 0; endTimer = 60*50;
      setBanner("討 伐 完 了 !", 160);
      SFX.clear();
    }
    shake = Math.min(shake + (wpn.type==="blunt"?5:2), 12);
  }

  // ---------------- プレイヤー更新
  function updatePlayer(){
    if (P.invuln > 0) P.invuln--;
    if (P.rollIF > 0) P.rollIF--;
    P.st++;

    const mo = P.state === "attack" ? (MOTIONS[wpn.type][P.combo] || MOTIONS[wpn.type][0]) : null;

    switch (P.state){
      case "idle": case "walk": {
        P.vx = 0;
        if (down("ArrowLeft"))  { P.vx = -2.3; P.face = -1; }
        if (down("ArrowRight")) { P.vx =  2.3; P.face =  1; }
        P.state = P.vx !== 0 ? "walk" : "idle";
        if (down("ArrowDown")) { P.vx = 0; P.state = "idle"; }
        // 剥ぎ取り
        if (phase === "cleared" && pressed("ArrowDown")){
          const nearBody = Math.abs(P.x - M.x) < sp.bodyW/2 + 40 && M.carves > 0;
          const nearTail = tailObj && Math.abs(P.x - tailObj.x) < 60 && tailObj.carves > 0;
          if (nearBody || nearTail){
            P.state = "carve"; P.st = 0; P.carveTail = !nearBody && nearTail;
            break;
          }
        }
        if (pressed("KeyZ")) { P.state = "attack"; P.st = 0; P.combo = 0; P.atkDone = false; P.bounced = false; P.vx = 0; SFX.swing(); }
        else if (pressed("KeyX")) {
          P.state = "jump"; P.st = 0; P.vy = -9.7; P.onGround = false;
          P.jumpVx = down("ArrowLeft") ? -2.6 : down("ArrowRight") ? 2.6 : 0;
          SFX.jump();
        }
        else if (pressed("KeyC")) { P.state = "roll"; P.st = 0; P.rollIF = 14; P.vx = 0; SFX.roll(); }
        else if (pressed("KeyA") && P.potions > 0 && P.hp < P.maxHp) {
          P.state = "drink"; P.st = 0; P.potions--; P.drinkHeal = 60; P.vx = 0; SFX.potion();
        }
        break;
      }
      case "jump": {
        // 魔界村式:空中で軌道変更不可
        P.vx = P.jumpVx;
        if (pressed("KeyZ")) { P.state = "airatk"; P.st = 0; P.combo = 0; P.atkDone = false; P.bounced = false; SFX.swing(); }
        if (P.onGround) { P.state = "idle"; P.st = 0; }
        break;
      }
      case "airatk": {
        P.vx = P.jumpVx;
        const m0 = MOTIONS[wpn.type][0];
        if (P.st >= m0.windup && P.st < m0.windup + m0.active && !P.atkDone){
          P.atkId++;
          const b = m0.box;
          hitMonster({ x: P.x + (P.face>0? b.ox : -b.ox-b.w), y: P.y + b.oy - b.h/2, w: b.w, h: b.h });
          P.atkDone = true;
        }
        if (P.st > m0.windup + m0.active + 6 || P.onGround){
          P.state = P.onGround ? "idle" : "jump"; P.st = 0;
        }
        break;
      }
      case "attack": {
        P.vx = 0;
        const total = mo.windup + mo.active + mo.recover + (P.bounced ? 14 : 0);
        if (P.st === mo.windup) { P.atkId++; P.atkDone = false; }
        if (P.st >= mo.windup && P.st < mo.windup + mo.active){
          const b = mo.box;
          hitMonster({ x: P.x + (P.face>0? b.ox : -b.ox-b.w), y: P.y + b.oy - b.h/2, w: b.w, h: b.h });
        }
        // 連係受付
        if (P.st >= mo.windup + mo.active && pressed("KeyZ") && !P.bounced
            && P.combo < MOTIONS[wpn.type].length - 1){
          P.combo++; P.st = 0; P.bounced = false; SFX.swing();
          break;
        }
        if (P.st >= total){ P.state = "idle"; P.st = 0; }
        break;
      }
      case "roll": {
        P.vx = P.face * 4.4;
        if (P.st >= 22){ P.state = "idle"; P.st = 0; P.vx = 0; }
        break;
      }
      case "drink": {
        P.vx = 0;
        if (P.st % 12 === 0 && P.drinkHeal > 0){
          const h = Math.min(8, P.drinkHeal);
          P.hp = Math.min(P.maxHp, P.hp + h); P.drinkHeal -= h;
        }
        if (P.st >= 105){ P.state = "idle"; P.st = 0; }
        break;
      }
      case "hurt": {
        if (P.onGround && P.st > 24){ P.state = "idle"; P.st = 0; P.vx = 0; }
        break;
      }
      case "carve": {
        P.vx = 0;
        if (P.st === 45){
          const tail = P.carveTail;
          const table = tail ? sp.tailCarve : sp.carve;
          const matId = pickWeighted(table);
          gain(matId, 1);
          if (tail) tailObj.carves--; else M.carves--;
          addDmg(P.x, P.y - 70, `${MATS[matId].name} 入手!`, "#aaffaa");
          SFX.carve();
          P.state = "idle"; P.st = 0;
        }
        break;
      }
      case "dead": break;
    }

    // 物理
    if (!P.onGround || P.vy < 0){
      P.vy += 0.52;
      if (P.vy > 12) P.vy = 12;
    }
    P.x += P.vx; P.y += P.vy;
    if (P.x < 40) P.x = 40;
    if (P.x > WORLD_W-40) P.x = WORLD_W-40;
    if (P.y >= GROUND_Y){ P.y = GROUND_Y; P.vy = 0; P.onGround = true; }
    else P.onGround = false;
  }

  // ---------------- モンスター更新
  function pickMove(){
    const dist = Math.abs(P.x - M.x);
    const cands = sp.moves.filter(m => dist >= m.minD && dist <= m.maxD);
    if (!cands.length) return null;
    let tw = 0; for (const m of cands) tw += m.w;
    let r = Math.random()*tw;
    for (const m of cands){ r -= m.w; if (r <= 0) return m; }
    return cands[0];
  }

  function updateMonster(){
    M.animT++;
    if (M.dead){ M.deadT++; return; }
    if (phase !== "fight") return;

    // 怒り移行
    const enrageAt = sp.enrageAt || 0.4;
    if (!M.enraged && M.hp < M.maxHp * enrageAt){
      M.enraged = true; M.state = "roar"; M.st = 0; M.move = null;
      M.roarT = 70; SFX.roar(); shake = 14;
      setBanner(`${sp.short}が怒り狂っている!`, 100);
    }

    switch (M.state){
      case "roar": if (--M.roarT <= 0){ M.state = "idle"; M.cooldown = 30; } return;
      case "stun": {
        if (--M.stunT <= 0){ M.state = "idle"; M.cooldown = 40; }
        return;
      }
      case "flinch": {
        if (--M.flinchT <= 0){ M.state = "idle"; M.cooldown = 30; }
        return;
      }
      case "idle": {
        M.face = P.x > M.x ? 1 : -1;
        // ゆっくり間合いを詰める
        const dist = Math.abs(P.x - M.x);
        const spd = sp.walkSpd * (M.enraged ? 1.35 : 1);
        if (dist > 130) M.x += M.face * spd;
        M.cooldown -= M.enraged ? 1.5 : 1;
        if (M.cooldown <= 0){
          const mv = pickMove();
          if (mv){ M.move = mv; M.state = "act"; M.st = 0; M.hitPlayerDone = false; M.projFired = false; }
          else M.cooldown = 20;
        }
        return;
      }
      case "act": {
        const mv = M.move;
        M.st++;
        const spdMul = M.enraged ? 1.25 : 1;
        const inActive = M.st > mv.windup && M.st <= mv.windup + mv.active;

        if (mv.kind === "melee"){
          if (inActive && !M.hitPlayerDone){
            const b = mv.box;
            const hb = { x: M.x + b.ox*M.face - b.w/2, y: M.y + b.oy - b.h/2, w: b.w, h: b.h };
            if (overlap(hb, playerBox())){ hurtPlayer(mv.dmg, M.x); M.hitPlayerDone = true; }
          }
        } else if (mv.kind === "lunge" || mv.kind === "roll"){
          if (inActive){
            M.x += M.face * mv.spd * spdMul;
            if (M.x < 100 || M.x > WORLD_W-100){ M.st = mv.windup + mv.active; } // 壁で終了
            const bodyB = partBoxes().body;
            if (bodyB && overlap(bodyB, playerBox()) && !M.hitPlayerDone){
              hurtPlayer(mv.dmg, M.x); M.hitPlayerDone = true;
            }
          }
        } else if (mv.kind === "jump"){
          if (M.st === mv.windup){
            const dx = P.x - M.x;
            M.vy = -11; M.vx = dx / 44;
            M.airborne = true;
          }
          if (M.airborne){
            M.vy += 0.5; M.x += M.vx * spdMul; M.y += M.vy;
            if (M.y >= GROUND_Y){
              M.y = GROUND_Y; M.airborne = false; shake = 10;
              // 着地衝撃
              const bodyB = partBoxes().body;
              if (bodyB && overlap(bodyB, playerBox())) hurtPlayer(mv.dmg, M.x);
              else if (P.onGround && Math.abs(P.x - M.x) < sp.bodyW/2 + 60) hurtPlayer(Math.round(mv.dmg*0.6), M.x);
              M.st = mv.windup + mv.active; // recoverへ
            }
            if (M.airborne) return; // 空中は継続
          }
        } else if (mv.kind === "proj"){
          if (M.st === mv.windup && !M.projFired){
            M.projFired = true;
            const n = mv.proj.n;
            for (let i=0;i<n;i++){
              const spread = (i - (n-1)/2) * 0.10;
              const dx = P.x - (M.x + 60*M.face), dy = (P.y-30) - (M.y - 70);
              const len = Math.hypot(dx,dy)||1;
              projs.push({
                x: M.x + 60*M.face, y: M.y - 70,
                vx: (dx/len)*mv.proj.spd + spread*3, vy: (dy/len)*mv.proj.spd + spread*-2,
                ele: mv.proj.ele, dmg: mv.dmg, t:0,
              });
            }
            beep(500, 0.12, "sawtooth", 0.04);
          }
        } else if (mv.kind === "aoe"){
          if (M.st === mv.windup){
            shake = 14; beep(60, 0.4, "sawtooth", 0.08);
          }
          if (inActive){
            if (P.onGround && Math.abs(P.x - M.x) < mv.r && !M.hitPlayerDone){
              hurtPlayer(mv.dmg, M.x); M.hitPlayerDone = true;
            }
          }
        }

        if (M.st >= mv.windup + mv.active + mv.recover){
          M.state = "idle";
          M.cooldown = (M.enraged ? 40 : 70) + Math.random()*40;
          M.move = null;
        }
        return;
      }
    }
  }

  // ---------------- 弾更新
  function updateProjs(){
    for (let i=projs.length-1;i>=0;i--){
      const p = projs[i];
      p.x += p.vx; p.y += p.vy; p.t++;
      if (overlap({x:p.x-8,y:p.y-8,w:16,h:16}, playerBox())){
        hurtPlayer(p.dmg, p.x); projs.splice(i,1); continue;
      }
      if (p.y > GROUND_Y || p.x < 0 || p.x > WORLD_W || p.t > 240){
        addSpark(p.x, Math.min(p.y, GROUND_Y), ELE_COLOR[p.ele], 5);
        projs.splice(i,1);
      }
    }
  }

  // ---------------- クエスト終了処理
  function finishQuest(){
    // 基本報酬
    save.zenny += quest.zenny;
    const pulls = 3 + Math.floor(Math.random()*2);
    for (let i=0;i<pulls;i++) gain(pickWeighted(quest.rewards), 1);
    save.cleared[quest.id] = true;
    save.hunts++;
    commitSave();
    phase = "result"; phaseT = 0;
  }

  // ---------------- 描画
  function drawBG(){
    // 空
    const g = ctx.createLinearGradient(0,0,0,540);
    g.addColorStop(0,"#0a0818"); g.addColorStop(1,"#241830");
    ctx.fillStyle = g; ctx.fillRect(0,0,960,540);
    // 月
    ctx.fillStyle="#ccbb88"; ctx.beginPath(); ctx.arc(780 - cam*0.1, 90, 46, 0, 7); ctx.fill();
    // 遠景山
    ctx.fillStyle="#141026";
    ctx.beginPath(); ctx.moveTo(-cam*0.3, 420);
    for (let i=0;i<=8;i++) ctx.lineTo(-cam*0.3 + i*260, i%2? 260: 380);
    ctx.lineTo(2200, 540); ctx.lineTo(-200, 540); ctx.fill();
    // 墓・枯れ木(中景)
    for (let i=0;i<10;i++){
      const x = i*190 - cam*0.6;
      rect(x, 430, 22, 34, "#1c1c2c");
      rect(x-5, 424, 32, 9, "#242438");
    }
    // 地面
    rect(0, GROUND_Y, 960, 540-GROUND_Y, "#221a28");
    ctx.fillStyle="#332639";
    for (let i=0;i<30;i++){
      const x = ((i*77 - cam) % 1040 + 1040) % 1040 - 40;
      ctx.fillRect(x, GROUND_Y, 34, 5);
    }
    // 壁表現
    if (cam < 20) rect(40-cam-16, GROUND_Y-120, 16, 120, "#443355");
    if (cam > WORLD_W-960-20) rect(WORLD_W-40-cam, GROUND_Y-120, 16, 120, "#443355");
  }

  function drawPlayer(){
    const x = P.x - cam, y = P.y;
    if (P.invuln > 0 && (t/3|0)%2 === 0 && P.state !== "dead") return;
    ctx.save();
    ctx.translate(x, y);
    const f = P.face;
    const walk = (P.state==="walk") ? Math.sin(t*0.4)*3 : 0;
    // 死亡
    if (P.state === "dead"){
      ctx.rotate(-Math.PI/2 * Math.min(1, P.st/20) * f);
    }
    if (P.state === "roll"){
      ctx.rotate(f * P.st * 0.5);
      ctx.translate(0, -20);
      rect(-11,-11,22,22,"#8899bb"); rect(-8,-8,16,16,"#5566aa");
      ctx.restore(); return;
    }
    // 脚
    rect(-9, -18+Math.max(0,walk), 8, 18-Math.max(0,walk), "#445577");
    rect(1,  -18+Math.max(0,-walk),8, 18-Math.max(0,-walk), "#445577");
    // 体(鎧)
    rect(-11, -40, 22, 24, "#8899bb");
    rect(-11, -40, 22, 5, "#aabbdd");
    // 頭(兜)
    rect(-9, -54, 18, 15, "#99aacc");
    rect(f>0? 2: -8, -50, 6, 5, "#332222"); // 目元
    rect(-9, -58, 18, 5, "#ccddee");        // 兜の縁
    // 飲むモーション
    if (P.state === "drink"){
      rect(f*8-3, -52, 6, 10, "#66dd66");
    }
    // 剥ぎ取りモーション
    if (P.state === "carve"){
      rect(f*10-2, -30+ (P.st%20<10?0:4), 4, 12, "#ddddcc");
    }
    // 武器
    drawWeapon(f);
    ctx.restore();
  }
  function drawWeapon(f){
    const inAtk = (P.state === "attack" || P.state === "airatk");
    const mo = inAtk ? (MOTIONS[wpn.type][P.combo]||MOTIONS[wpn.type][0]) : null;
    const phaseA = !inAtk ? 0 : P.st < mo.windup ? 1 : (P.st < mo.windup+mo.active ? 2 : 3);
    const col = wpn.ele ? ELE_COLOR[wpn.ele] : "#ccccdd";
    ctx.save();
    if (wpn.type === "slash"){
      if (phaseA === 2){
        ctx.strokeStyle = col; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(f*10, -32, 44, f>0?-1.4:2.4, f>0?0.9:4.6); ctx.stroke();
        ctx.rotate(f*1.1);
        rect(f*4, -58, 5, 34, col);
      } else if (phaseA === 1){
        ctx.rotate(-f*0.9); rect(f*6-2, -66, 5, 34, col);
      } else {
        rect(f*12, -50, 4, 30, col);
      }
    } else if (wpn.type === "pierce"){
      if (phaseA === 2){
        rect(f>0? 12 : -12-76, -34, 76, 6, "#997755");
        rect(f>0? 84 : -96, -37, 12, 12, col);
      } else if (phaseA === 1){
        rect(f>0? 4 : -4-50, -34, 50, 5, "#997755");
      } else {
        rect(f*10-2, -64, 5, 40, "#997755");
        rect(f*10-3, -70, 7, 9, col);
      }
    } else { // blunt
      if (phaseA === 2){
        rect(f>0? 8: -8-40, -66, 40, 8, "#997755");
        rect(f>0? 40: -64, -84, 26, 26, col);
      } else if (phaseA === 1){
        ctx.rotate(-f*1.6);
        rect(f*4, -74, 7, 40, "#997755");
        rect(f*4-8, -88, 24, 20, col);
      } else {
        rect(f*10-3, -60, 6, 36, "#997755");
        rect(f*10-11, -74, 22, 18, col);
      }
    }
    ctx.restore();
  }

  function drawMonster(){
    const x = M.x - cam, y = M.y;
    const f = M.face;
    ctx.save();
    ctx.translate(x, y);
    if (M.dead){
      const r = Math.min(1, M.deadT/26);
      ctx.rotate(f * r * Math.PI/2 * 0.55);
      ctx.globalAlpha = 1;
    }
    const flash = sparksFlash();
    const bodyC = flash ? "#ffffff" : sp.color;
    const darkC = flash ? "#dddddd" : sp.color2;
    const legAnim = (M.state==="idle" && !M.dead) ? Math.sin(M.animT*0.25)*4 : 0;

    // 尻尾
    if (!M.tailCut){
      const tp = sp.parts.tail;
      ctx.fillStyle = darkC;
      ctx.beginPath();
      ctx.moveTo(f*(-sp.bodyW/2+16), tp.oy-tp.h/2);
      ctx.lineTo(f*(tp.ox-tp.w/2-6), tp.oy);
      ctx.lineTo(f*(-sp.bodyW/2+16), tp.oy+tp.h/2);
      ctx.fill();
    } else {
      rect(f>0? -sp.bodyW/2-4 : sp.bodyW/2-12, sp.parts.tail.oy-8, 16, 16, "#aa3333");
    }
    // 脚
    ctx.fillStyle = darkC;
    rect(f*(-sp.bodyW/4)-10, -26+legAnim/2, 18, 26-legAnim/2, darkC);
    rect(f*(sp.bodyW/4)-10, -26-legAnim/2, 18, 26+legAnim/2, darkC);
    // 胴体
    const bp = sp.parts.body;
    ctx.fillStyle = bodyC;
    ctx.beginPath();
    ctx.ellipse(0, bp.oy, bp.w/2, bp.h/2, 0, 0, 7);
    ctx.fill();
    // 種族ごとの飾り
    if (quest.target === "garudos"){
      // 翼
      ctx.fillStyle = flash?"#eeeeee":sp.accent;
      ctx.beginPath();
      ctx.moveTo(0, bp.oy-14); ctx.lineTo(f*-46, bp.oy-46 - legAnim); ctx.lineTo(f*-20, bp.oy+4); ctx.fill();
    } else if (quest.target === "ganrock"){
      // 甲羅の凹凸
      ctx.fillStyle = flash?"#eeeeee":sp.accent;
      for (let i=-2;i<=2;i++) rect(i*26-8, bp.oy-bp.h/2-4, 16, 12, flash?"#eeeeee":sp.accent);
    } else if (quest.target === "volteus"){
      // 背びれ(雷)
      ctx.fillStyle = flash?"#ffffff":sp.accent;
      for (let i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.moveTo(i*30-10, bp.oy-bp.h/2+4); ctx.lineTo(i*30, bp.oy-bp.h/2-24); ctx.lineTo(i*30+10, bp.oy-bp.h/2+4); ctx.fill();
      }
    } else if (quest.target === "aqualos"){
      ctx.fillStyle = flash?"#eeeeee":sp.accent;
      ctx.beginPath(); ctx.ellipse(f*-20, bp.oy-bp.h/2+2, 30, 10, 0, 0, 7); ctx.fill();
    }
    // 頭
    const hp_ = sp.parts.head;
    ctx.fillStyle = bodyC;
    ctx.beginPath();
    ctx.ellipse(f*hp_.ox, hp_.oy, hp_.w/2, hp_.h/2, 0, 0, 7);
    ctx.fill();
    // くちばし/口
    ctx.fillStyle = flash?"#ffffff":sp.accent;
    ctx.beginPath();
    ctx.moveTo(f*(hp_.ox+hp_.w/2-6), hp_.oy-8);
    ctx.lineTo(f*(hp_.ox+hp_.w/2+18), hp_.oy+2);
    ctx.lineTo(f*(hp_.ox+hp_.w/2-6), hp_.oy+10);
    ctx.fill();
    // 目
    ctx.fillStyle = M.enraged ? "#ff3333" : "#ffee66";
    ctx.beginPath(); ctx.arc(f*(hp_.ox+6), hp_.oy-8, 5, 0, 7); ctx.fill();
    // スタン星
    if (M.stunT > 0){
      for (let i=0;i<3;i++){
        const a = M.animT*0.15 + i*2.1;
        text("★", f*hp_.ox + Math.cos(a)*30, hp_.oy - 40 + Math.sin(a)*8, 16, "#ffee55", "center");
      }
    }
    // 怒りオーラ
    if (M.enraged && !M.dead && (M.animT/4|0)%2===0){
      ctx.strokeStyle = "rgba(255,60,60,0.5)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, bp.oy, bp.w/2+10, bp.h/2+10, 0, 0, 7); ctx.stroke();
    }
    // 予備動作の表示(点滅)
    if (M.state === "act" && M.move && M.st <= M.move.windup && (M.animT/4|0)%2===0){
      ctx.strokeStyle = "#ffff88"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(f*hp_.ox, hp_.oy, hp_.w/2+8, hp_.h/2+8, 0, 0, 7); ctx.stroke();
    }
    ctx.restore();

    // 切断された尻尾
    if (tailObj){
      const tx = tailObj.x - cam;
      ctx.fillStyle = sp.color2;
      ctx.beginPath();
      ctx.moveTo(tx-28, GROUND_Y-6); ctx.lineTo(tx+28, GROUND_Y-16); ctx.lineTo(tx+20, GROUND_Y); ctx.fill();
      if (phase === "cleared" && tailObj.carves > 0)
        text("↓剥ぎ取り", tx, GROUND_Y - 28, 13, "#aaffaa", "center");
    }
  }
  let hitFlashT = 0;
  function sparksFlash(){ return hitFlashT > 0; }

  // ---------------- メイン
  return {
    update(){
      t++;
      if (bannerT > 0) bannerT--;
      if (hitFlashT > 0) hitFlashT--;
      if (shake > 0) shake -= 0.8; else shake = 0;

      if (phase === "intro"){
        phaseT++;
        if (phaseT === 1) setBanner(`${sp.name} 討伐開始!`, 120);
        if (phaseT > 40) phase = "fight";
        return;
      }
      if (phase === "result"){ if (pressed("KeyZ")) setScene(VillageScene()); return; }
      if (phase === "failed"){
        updatePlayer();
        phaseT++;
        if (phaseT > 40 && pressed("KeyZ")) setScene(VillageScene());
        endFrameShake();
        return;
      }

      // ポーズ
      if (pressed("Enter") && phase === "fight"){
        paused = !paused; pauseCur = 0; SFX.cursor();
      }
      if (paused){
        if (pressed("ArrowUp")||pressed("ArrowDown")){ pauseCur = 1-pauseCur; SFX.cursor(); }
        if (pressed("KeyZ")){
          if (pauseCur === 0) paused = false;
          else { SFX.cancel(); setScene(VillageScene()); }
        }
        return;
      }

      if (phase === "fight"){
        timer--;
        if (timer <= 0){ phase = "failed"; phaseT = 0; setBanner("時間切れ…", 120); SFX.fail(); return; }
      }
      if (phase === "cleared"){
        endTimer--;
        if (endTimer <= 0 || pressed("Enter")){ finishQuest(); return; }
      }

      updatePlayer();
      updateMonster();
      updateProjs();

      // カメラ
      cam += ((P.x - 480) - cam) * 0.12;
      cam = Math.max(0, Math.min(WORLD_W - 960, cam));
      endFrameShake();

      // エフェクト
      for (let i=dmgNums.length-1;i>=0;i--){
        const d = dmgNums[i]; d.t++; d.y -= 0.8;
        if (d.t > 60) dmgNums.splice(i,1);
      }
      for (let i=sparks.length-1;i>=0;i--){
        const s = sparks[i]; s.t++; s.x += s.vx; s.y += s.vy; s.vy += 0.3;
        if (s.t > 24) sparks.splice(i,1);
      }
    },
    draw(){
      ctx.save();
      if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
      drawBG();
      drawMonster();
      drawPlayer();
      // 弾
      for (const p of projs){
        ctx.fillStyle = ELE_COLOR[p.ele];
        ctx.beginPath(); ctx.arc(p.x-cam, p.y, 8, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.beginPath(); ctx.arc(p.x-cam, p.y, 4, 0, 7); ctx.fill();
      }
      // AoE演出
      if (M.state === "act" && M.move && M.move.kind === "aoe"){
        const mv = M.move;
        if (M.st > mv.windup && M.st <= mv.windup + mv.active){
          ctx.strokeStyle = sp.accent; ctx.lineWidth = 4;
          const rr = mv.r * ((M.st - mv.windup)/mv.active);
          ctx.beginPath(); ctx.arc(M.x-cam, GROUND_Y, rr, Math.PI, 0); ctx.stroke();
        } else if (M.st <= mv.windup && (t/4|0)%2===0){
          ctx.strokeStyle = "rgba(255,255,100,0.4)"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(M.x-cam, GROUND_Y, mv.r, Math.PI, 0); ctx.stroke();
        }
      }
      // スパーク
      for (const s of sparks) rect(s.x-cam-2, s.y-2, 4, 4, s.col);
      // ダメージ数字
      for (const d of dmgNums){
        const a = d.t > 40 ? 1-(d.t-40)/20 : 1;
        ctx.globalAlpha = a;
        text(String(d.v), d.x-cam, d.y, d.big?22:16, d.col, "center");
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      drawHUD();
      if (phase === "result") drawResult();
      if (phase === "failed" && phaseT > 30) drawFailed();
      if (paused){
        panel(330, 190, 300, 160);
        text("ポーズ", 480, 226, 20, "#ffddaa", "center");
        text((pauseCur===0?"▶ ":"  ")+"クエストを続ける", 370, 270, 17, pauseCur===0?"#ffee88":"#ccccdd");
        text((pauseCur===1?"▶ ":"  ")+"撤退して村へ帰る", 370, 302, 17, pauseCur===1?"#ffee88":"#ccccdd");
      }
    },
    // デバッグ用フック
    _dbg: { P, M, projs, get phase(){return phase;}, set phase(v){phase=v;}, quest, finishQuest },
  };
}
function endFrameShake(){ } // (shakeはHuntScene内で減衰)

// shake減衰をグローバルtickに
// ※HuntSceneのshakeはクロージャ内なのでdraw時に減衰させる
// 簡易化のためHuntScene.update内で処理済みとする

// =====================================================================
//  メインループ
// =====================================================================
loadSave();
setScene(TitleScene());

// shake減衰: HuntScene内のshakeはupdateで直接減らす形にパッチ
// (endFrameShake内では何もしない。減衰はここで行うためHuntScene側のshake変数を都度減らす)

let _last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  // 60fps固定ステップ(簡易)
  if (ts - _last < 12) return;
  _last = ts;
  scene.update();
  scene.draw();
  endFrameInput();
}
requestAnimationFrame(frame);

// デバッグ用に公開
window.G = {
  get save(){ return save; },
  get scene(){ return scene; },
  setScene, VillageScene, HuntScene, QUESTS, WEAPONS, SPECIES,
  startQuest(i){ setScene(HuntScene(QUESTS[i])); },
  reset(){ localStorage.removeItem(SAVE_KEY); loadSave(); setScene(TitleScene()); },
};
</script>
